<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saratoga Block — 8 Week Training</title>
<style>
:root{
  --bg:#12141A; --surface:#1B1E26; --surface-2:#242832; --line:#2E3340;
  --text:#E9EAEE; --muted:#8B90A0;
  --p25:#D93B3B; --p20:#2E7BC4; --p15:#E0AC26; --p10:#2FA35C; --eq:#6E92C4;
  --mono: ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{min-height:100dvh;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--p15);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 44px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
header.mast{padding:8px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.mast h1{font-size:25px;line-height:1.08;margin:6px 0;font-weight:750;letter-spacing:-.02em}
.mast p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.weeks{display:flex;gap:6px;margin:16px 0 8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:44px;padding:10px 6px;border-radius:9px;background:var(--surface);text-align:center;
    font-family:var(--mono);font-size:15px;color:var(--muted);border:1px solid transparent}
.wk b{display:block;font-size:9px;letter-spacing:.12em;font-weight:600;opacity:.75;margin-top:2px}
.wk.sel{background:var(--surface-2);color:var(--text);border-color:var(--p15)}
.wk-note{font-size:12.5px;color:var(--muted);margin:2px 0 18px;line-height:1.5}
.wk-note b{color:var(--text);font-weight:600}
.day{width:100%;text-align:left;background:var(--surface);border-radius:13px;padding:15px 16px;margin-bottom:9px;border:1px solid var(--line);display:block}
.day:active{background:var(--surface-2)}
.day .top{display:flex;align-items:center;gap:9px}
.day .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:4px;color:#0E1014;font-weight:700}
.day .done{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--p10)}
.day h3{font-size:17px;margin:8px 0 4px;font-weight:650;letter-spacing:-.01em}
.day p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.meta{margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:14px 0}
.panel h4{margin:0 0 3px;font-size:14px;font-weight:600}
.panel .sub{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.optrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.optrow:first-of-type{border-top:0}
.optrow .lbl{flex:1;font-size:13.5px}
.optrow .lbl span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.sw{flex:0 0 48px;height:28px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.sw[aria-pressed="true"]{background:rgba(224,172,38,.22);border-color:var(--p15)}
.sw[aria-pressed="true"]::after{transform:translateX(20px);background:var(--p15)}
input[type=range]{width:100%;accent-color:var(--p15);margin:8px 0 2px}
.btnwide{width:100%;padding:12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
         font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text);margin-top:8px}
.sndstate{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:10px;color:var(--muted)}
.sndstate b{color:var(--p10)} .sndstate.warn b{color:var(--p15)}
.back{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 0;margin-bottom:6px}
.sec{margin:22px 0}
.sec-h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.sec-h .dot{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
.sec-h h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);font-weight:600}
.sec-h .fmt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ex{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.ex .thumb{flex:0 0 60px;height:60px;background:var(--bg);border-radius:8px;border:1px solid var(--line);overflow:hidden}
.ex .b{flex:1;min-width:0}
.ex .b strong{font-size:15px;font-weight:600;display:block;letter-spacing:-.01em}
.ex .b .pre{font-family:var(--mono);font-size:12px;color:var(--p15);margin-top:3px}
.ex .b .cue{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.ex .b .swap{font-size:12px;color:var(--eq);margin-top:4px;line-height:1.45}
.ex .r{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:0 0 auto;padding-top:3px}
.start{position:sticky;bottom:14px;width:100%;padding:17px;border-radius:13px;background:var(--p25);color:#fff;font-size:16px;
       font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono);margin-top:26px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#sheet{position:fixed;inset:0;background:rgba(8,9,12,.74);display:none;z-index:60;align-items:flex-end}
#sheet.on{display:flex}
.sheet-c{background:var(--surface);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;border-top:1px solid var(--line);
         padding:16px 18px calc(24px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.sheet-c .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet-c h3{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.sheet-c .kind{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.demo{background:var(--bg);border:1px solid var(--line);border-radius:12px;height:210px;margin:14px 0;display:block;width:100%}
.steps{list-style:none;padding:0;margin:6px 0 0;counter-reset:s}
.steps li{position:relative;padding:9px 0 9px 30px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;font-family:var(--mono);font-size:11px;color:var(--p15)}
.cuebox{font-size:13px;color:var(--muted);line-height:1.55;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ytl{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
     color:var(--text);text-decoration:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase}
.closebtn{width:100%;padding:14px;margin-top:10px;border-radius:9px;background:var(--surface-2);font-family:var(--mono);font-size:11.5px;
          letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* ---------------- run ---------------- */
#run{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50}
#run.on{display:flex}
.rtop{padding:12px 16px 0}
.rtop .row{display:flex;align-items:center;gap:10px}
.rtop .row .eyebrow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quit{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding:6px 2px}
.pips{display:flex;gap:4px;margin:11px 0 2px}
.pip{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.pip.on{background:var(--p10)} .pip.cur{background:var(--p15)} .pip.def{background:var(--eq)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 18px;text-align:center;min-height:0;overflow:hidden}
.state{font-family:var(--mono);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:700}
.exname{font-size:clamp(20px,6vw,28px);font-weight:750;line-height:1.12;letter-spacing:-.02em;margin:6px 0 0;max-width:18ch}
#runDemo{width:100%;max-width:290px;height:clamp(96px,19vh,150px);margin:2px 0}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.05em;font-size:clamp(54px,17vw,96px);line-height:.92;margin:0}
.target{font-family:var(--mono);font-size:15px;letter-spacing:.03em;margin-top:4px}
.target b{color:var(--p15)}
.last{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.05em}
.cue{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45;max-width:32ch}
.setdots{display:flex;gap:6px;justify-content:center;margin-top:9px}
.sd{width:9px;height:9px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.sd.on{background:var(--p10);border-color:var(--p10)} .sd.cur{background:var(--p15);border-color:var(--p15)}
.logger{display:flex;gap:8px;margin-top:12px;width:100%;max-width:330px}
.field{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 8px}
.field .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field .row2{display:flex;align-items:center;gap:4px;margin-top:2px}
.field button{flex:0 0 30px;height:30px;border-radius:8px;background:var(--surface-2);font-size:17px;line-height:1;font-weight:600;color:var(--text)}
.field .val{flex:1;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;text-align:center}
.stage.pulse .clock{animation:beat .5s ease-in-out}
@keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.stage.pulse .clock{animation:none}}
.controls{padding:8px 16px calc(14px + env(safe-area-inset-bottom))}
.primary{width:100%;padding:18px;border-radius:13px;background:var(--p10);color:#08130C;font-size:16px;font-weight:800;
         letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.primary.rest{background:var(--p20);color:#fff}
.primary.dim{background:var(--surface-2);color:var(--text)}
.subrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.sub{padding:13px 4px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);
     font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sub:active{background:var(--surface-2)}
.sub.warnb{color:var(--eq);border-color:#33415A}
.end{text-align:center;padding:34px 20px}
.end h2{font-size:28px;margin:12px 0 8px;letter-spacing:-.02em}
.end p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 auto;max-width:32ch}
.logtable{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin:22px 0;text-align:left}
.logtable .lr{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.logtable .lr:first-child{border-top:0}
.logtable .lr b{flex:1;font-weight:600}
.logtable .lr span{font-family:var(--mono);font-size:12px;color:var(--muted)}
footer{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
footer b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="run">
  <div class="rtop">
    <div class="row"><div class="eyebrow" id="rHead">—</div><button class="quit" id="bQuit">End</button></div>
    <div class="pips" id="rPips"></div>
  </div>
  <div class="stage" id="stage">
    <div class="state" id="rState">—</div>
    <div class="exname" id="rName">—</div>
    <svg id="runDemo" viewBox="0 0 220 150" aria-hidden="true"></svg>
    <div class="clock num" id="rClock"></div>
    <div class="target" id="rTarget"></div>
    <div class="setdots" id="rDots"></div>
    <div class="last" id="rLast"></div>
    <div class="cue" id="rCue"></div>
    <div class="logger" id="rLogger" style="display:none">
      <div class="field"><div class="cap">Weight kg</div><div class="row2">
        <button id="wDown">−</button><div class="val num" id="wVal">0</div><button id="wUp">+</button></div></div>
      <div class="field"><div class="cap">Reps done</div><div class="row2">
        <button id="rDown">−</button><div class="val num" id="rVal">0</div><button id="rUp">+</button></div></div>
    </div>
  </div>
  <div class="controls">
    <button class="primary" id="bMain">Set done</button>
    <div class="subrow">
      <button class="sub" id="bPrev">Back</button>
      <button class="sub warnb" id="bDefer">Station busy</button>
      <button class="sub" id="bSkip">Skip</button>
    </div>
  </div>
</div>
<div id="sheet"><div class="sheet-c" id="sheetC"></div></div>

<script>

const HOWTO={"latraise":{"name":"Lateral raise","steps":["A light dumbbell in each hand, elbows very slightly bent.","Lead with the elbows and raise out to the sides until the arms are level with the shoulders.","Lower slowly. If you have to swing to move it, the weight is too heavy."]},"calfraise":{"name":"Calf raise","steps":["Stand with the balls of your feet on the edge of the step, holding a dumbbell.","Let the heels sink below the step for a full stretch.","Drive up onto the toes as high as you can and pause a second at the top."]},"hipthrust":{"name":"Hip thrust","steps":["Upper back on the bench, feet planted, weight across the hips.","Drive through the heels and squeeze the glutes hard to lift the hips level with the torso.","Tuck the ribs down. The movement comes from the hips, not the low back."]},"farmercarry":{"name":"Farmer carry","steps":["A heavy dumbbell in each hand, arms straight, shoulders pulled back.","Walk tall with short controlled steps. Don't lean away from the weight.","Grip is the point. Set them down when your hands give out, not your legs."]},"curl_db":{"name":"Dumbbell curl","steps":["Stand tall, elbows pinned to the sides, palms facing forward.","Curl up under control and squeeze at the top.","Lower slowly all the way to straight. No swinging from the hips."]},"tricepsext":{"name":"Overhead triceps extension","steps":["Seated with the back supported, one dumbbell held overhead in both hands.","Lower it behind your head by bending only at the elbow. Upper arms stay vertical.","Press back up to straight and squeeze the triceps."]},"facepull":{"name":"Face pull","steps":["Cable set at face height, a rope or handles in each hand, arms extended.","Pull toward your face, leading with the elbows and finishing with the hands beside your ears.","Squeeze the rear shoulders for a beat. Light weight, high reps."]},"splitsquat":{"name":"Bulgarian split squat","steps":["Back foot resting on the box, front foot far enough forward to stay vertical.","Lower straight down until the back knee is close to the floor.","Drive up through the front heel. All the work stays in the front leg."]},"squat_bar":{"name":"Back squat","steps":["Bar across the traps, not the neck. Feet shoulder width, toes turned out slightly.","Brace your stomach, break at the hips and knees together, knees tracking out over the toes.","Go as deep as you can hold a flat back, then drive the floor away — hips and chest rise together."]},"squat_smith":{"name":"Smith machine squat","steps":["Feet slightly forward of the bar so your hips can travel back into the rails.","Same depth as a free squat. The machine holds the path, so all you control is depth and tempo.","Unlock the hooks before you start and re-lock at the top of the last rep."]},"squat_goblet":{"name":"Goblet squat","steps":["One bell held against the chest, elbows tucked inside the knees at the bottom.","Stay far more upright than a barbell squat — the load is in front, so the chest stays tall.","Sit straight down between the heels, pause, then stand."]},"squat_air":{"name":"Bodyweight squat","steps":["Arms reach forward as a counterweight as you descend.","Slow on the way down, pause at the bottom, drive the knees out.","Full depth every rep — this is a warm-up, so quality over speed."]},"rdl_bar":{"name":"Romanian deadlift","steps":["Soft knees, then push the hips straight back. This is a hinge, not a squat.","Bar stays touching your legs the whole way down, back flat.","Stop when the hamstrings run out of length, then squeeze the glutes to stand tall."]},"rdl_db":{"name":"Dumbbell RDL","steps":["A dumbbell in each hand, resting against the front of the thighs.","Push the hips back and let the bells slide down the legs. Flat back throughout.","Drive the hips forward to stand. Don't lean back at the top."]},"swing_kb":{"name":"Kettlebell swing","steps":["Hike the bell back between the legs like a rugby pass — forearms against the thighs.","Snap the hips forward hard. The bell floats to chest height; your arms don't lift it.","Let it fall, absorb it with the hips, straight into the next rep."]},"backext":{"name":"Back extension","steps":["Pads just below the hip bones, heels locked under the roller.","Hinge down until you feel the hamstrings, back staying flat.","Squeeze the glutes to come up and stop in a straight line — don't arch past it."]},"glutebridge":{"name":"Glute bridge","steps":["Shoulders on the mat, knees bent, heels close to your backside.","Drive through the heels and squeeze the glutes to lift the hips.","Hold for a second at the top. Ribs stay down — don't arch the low back."]},"lunge_db":{"name":"Reverse lunge","steps":["A dumbbell in each hand. Step back and lower the back knee toward the floor.","Front shin stays close to vertical, torso upright, weight through the front heel.","Drive back up through the front leg without pushing off the back foot."]},"stepup":{"name":"Step-up","steps":["Whole front foot on the step — the heel must not hang off.","Drive through the front heel and stand fully tall at the top.","Lower slowly under control. No hopping off the trailing leg."]},"legpress":{"name":"Seated leg press","steps":["Feet mid-platform, about shoulder width, back flat against the pad.","Lower until the knees are around ninety degrees. Stop before the low back rounds off the seat.","Press through the whole foot and stop just short of locking the knees."]},"legext":{"name":"Leg extension","steps":["Knees lined up with the machine's pivot, pad sitting on the ankles.","Extend until the legs are straight and pause a full second at the top.","Lower slowly — don't let the stack bang down."]},"legcurl":{"name":"Leg curl","steps":["Pad just above the heels, thighs pinned to the seat.","Curl the heels down and back as far as the machine allows, and squeeze the hamstrings.","Two seconds to return. The hips stay put the whole set."]},"bench_bar":{"name":"Bench press","steps":["Shoulder blades pinned back and down, feet flat, safeties set at chest height.","Lower to the bottom of the sternum, elbows about forty-five degrees from the body.","Touch, then press up and slightly back toward your face."]},"bench_smith":{"name":"Smith machine bench","steps":["Set the bench so the bar path lands on your lower chest.","Same setup as a free bench — shoulders back and down, feet planted.","The rails hold the path, so control the tempo instead. Two seconds down."]},"chestpress":{"name":"Chest press machine","steps":["Set the seat so the handles start level with the middle of your chest.","Press out and squeeze hard at full extension.","Come back until you feel the chest stretch, then go again."]},"pushup":{"name":"Push-up","steps":["Hands under the shoulders, body in one straight line from head to heels.","Lower until the chest is a fist off the floor, elbows tucked to about forty-five degrees.","Press the floor away. Drop to the knees before the form goes."]},"ohp_db":{"name":"Dumbbell shoulder press","steps":["Seated with the back supported, bells at shoulder height, elbows slightly forward.","Ribs pulled down — don't arch the low back to get the weight up.","Press up and slightly back so it finishes over the middle of your head."]},"ohp_mach":{"name":"Shoulder press machine","steps":["Seat height so the handles start at shoulder level.","Press up without shrugging into your ears.","Stop just short of lockout to keep tension on the shoulder."]},"pushpress":{"name":"Push press","steps":["Weight at the shoulders, elbows in front, feet directly under the hips.","Short dip from the legs, then drive up and punch the weight overhead.","Lock out with the weight over the middle of your head, then lower under control."]},"thruster":{"name":"Thruster","steps":["Front rack position, elbows up. Squat to full depth.","Drive out of the bottom and let that momentum carry into the press — one continuous movement.","Lock out overhead, return to the shoulders, straight into the next rep."]},"fly_cable":{"name":"Fly / reverse fly","steps":["Slight bend in the elbows and keep it fixed for the whole set.","Move in a wide arc — think about hugging a barrel.","Squeeze for a full second at the end range, then let it stretch back."]},"extrot":{"name":"External rotation","steps":["Cable at elbow height, elbow pinned to your ribs.","Rotate the forearm away from your body. Only the forearm moves.","Light weight. This is a warm-up for the shoulder, not a lift."]},"pullapart":{"name":"Band pull-apart","steps":["Arms straight out in front at chest height, light tension on the band.","Pull the band apart by squeezing the shoulder blades together.","Control the return. High reps, no ego."]},"curl_mach":{"name":"Biceps curl machine","steps":["Upper arms flat on the pad, chest against the support.","Curl up under control and squeeze at the top.","Lower slowly — the lowering is where most of the growth comes from."]},"pushdown":{"name":"Triceps pushdown","steps":["Elbows locked to your ribs, slight forward lean.","Push down until the arms are straight and hold for a beat.","Let it come back only as far as your elbows can stay still."]},"pulldown":{"name":"Lat pulldown","steps":["Thighs locked under the pad, chest up, slight backward lean.","Pull to the collarbone by driving the elbows down into your pockets.","Control the way up until the shoulders are fully stretched."]},"chinup":{"name":"Assisted chin-up","steps":["Hang with straight arms and the shoulders pulled down away from your ears.","Pull your chest toward the bar, not just your chin over it.","Lower all the way down. Reduce the assistance as the weeks go on."]},"row_cable":{"name":"Cable row","steps":["Chest tall, slight forward lean at the start, arms extended.","Pull to the belly button and squeeze the shoulder blades for a beat.","Return under control. Don't rock the torso to move the weight."]},"plank":{"name":"Plank","steps":["Elbows under the shoulders, forearms flat on the mat.","Squeeze the glutes and pull the ribs down so the hips don ke_up":{"name":"Upright bike","steps":["Seat height so the knee is just short of straight at the bottom of the stroke.","Sit up, hands light on the bars.","Hold a steady cadence rather than mashing and coasting."]},"crosstrainer":{"name":"Cross-trainer","steps":["Whole foot on the pedal, upright posture.","Push and pull with the arms so it's a full body effort.","Keep the stride length consistent as you tire."]},"treadmill":{"name":"Treadmill","steps":["Set the incline first, then the speed.","Stay off the handrails — hold the belt speed with your legs.","To rest, straddle the belt rather than stopping the machine."]},"walk":{"name":"Easy walk","steps":["Flat and slow. This is recovery, not training.","Nose breathing if you can manage it.","Let the heart rate come down properly before you leave."]},"rope":{"name":"Battle rope","steps":["Half squat, chest up, weight in the middle of the feet.","Drive the waves from the hips and shoulders, not the wrists.","Keep the waves the same size for the whole interval — that's the test."]},"burpee":{"name":"Burpee","steps":["Squat down and plant the hands on the floor.","Jump or step the feet back and take the chest to the floor.","Come back up, feet under you, stand tall. Step instead of jumping to scale it."]},"breathing":{"name":"Box breathing","steps":["Sit down. Feet flat, hands resting on the thighs, spine tall.","In through the nose for four, hold for four, out for four, hold for four.","Keep the shoulders still — the breath should move your belly, not your chest."]},"foamroll":{"name":"Foam rolling","steps":["Put the roller under the muscle and take some weight through your hands.","Roll slowly, a few centimetres per second. Fast rolling does nothing.","When you find a spot that complains, stop there and breathe until it eases."]},"couchstr":{"name":"Couch stretch","steps":["Back foot up on the box or bench, back knee close to its base.","Tuck the pelvis under and squeeze the glute of the back leg — that's what makes it   const ci=(g,c,r,f,s,w)=>el(g,"circle",Object.assign({cx:c[0],cy:c[1],r:r,fill:f||"none"},s?{stroke:s,"stroke-width":w||2}:{}));

      else if(t==="pad"){ci(gp,T(j.ankle),7*S,EQ);}
      else if(t==="armpad") ln(gp,[OX-16*S,OY-34*S],[OX+30*S,OY-52*S],EQ,7*S);
      else if(t==="plate"){const a=T(j.ankle),L=pr[2]*S/2; ln(gp,[a[0]-5*S,a[1]-L],[a[0]-5*S,a[1]+L],EQ,5.4);}
      else if(t==="seatback") ln(gp,[OX-46*S,OY-34*S],[OX-70*S,OY-84*S],EQ,6);
      else if(t==="machineback") ln(gp,[OX-26*S,OY-30*S],[OX-32*S,OY-92*S],EQ,5.4);
      else if(t==="benchlegs"){ln(gp,[OX-78*S,OY-8*S],[OX-78*S,OY],EQ,3.6); ln(gp,[OX-4*S,OY-8*S],[OX-4*S,OY],EQ,3.6);}
      else if(t==="smithrails"){[-34,34].forEach(x=>ln(gp,[OX+x*S,OY],[OX+x*S,OY-150*S],EQ,2.6));}
      else if(t==="rail") ln(gp,[OX-74*S,OY-14*S],[OX+74*S,OY-14*S],EQ,3.4);

        for(let a=0;a<360;a+=45){const r=a*Math.PI/180; ln(gp,[OX-4*S,OY],[OX-4*S+30*S*Math.cos(r),OY+30*S*Math.sin(r)],EQ,1);}}
      else if(t==="bikeframe"){ln(gp,[OX-4*S,OY],[OX-4*S,OY-44*S],EQ,3.6); ci(gp,[OX-4*S,OY],24*S,"none",EQ,2.4);}

        el(gp,"path",{d:`M${h[0]} ${h[1]} Q ${h[0]+34*S} ${h[1]+22*S} ${h[0]+70*S} ${h[1]-4*S}`,fill:"none",stroke:EQ,"stroke-width":2.2});}
      else if(t==="seat"||t==="benchpad") rc(gp,OX+pr[1]*S,OY+pr[2]*S,(pr[3]-pr[1])*S,(pr[4]-pr[2])*S,EQ);
      else if(t==="frame") rc(gp,OX+pr[1]*S,OY+pr[2]*S,(pr[3]-pr[1])*S,(pr[4]-pr[2])*S,"none",EQ);

  function frame(now){
    const T_ms=2400,n=frames.length,x=((now-t0)%T_ms)/T_ms; let u,i0,i1;
    if(n===2){i0=0;i1=1;u=(1-Math.cos(x*2*Math.PI))/2;}
    else{const g=x*n;i0=Math.floor(g)%n;i1=(i0+1)%n;const s=g-Math.floor(g);u=(1-Math.cos(s*Math.PI))/2;}
    const j=fk(lerpPose(frames[i0],frames[i1],u)); drawProps(j); drawFig(j);
    raf=requestAnimationFrame(frame);
  }
  if(reduced){const j=fk(frames[frames.length-1]); drawProps(j); drawFig(j);}
  else raf=requestAnimationFrame(frame);
  return {stop(){if(raf)cancelAnimationFrame(raf);}};
}

/* ============================================================
   PROGRESSION HELPERS  (mirror of the validated Python model)
   ============================================================ */
const setsFor=(e,wi,s)=>{
  const W=WEEKS[wi];
  if(e.role==="main") return W.mainSets;
  const bump=(e.role==="acc" && (!s || s.work.length<=5)) ? W.addSet : 0;
  return Math.max(2, e.sets+bump);
};
const repsFor=(e,wi)=>{
  const W=WEEKS[wi];
  if(e.role==="hold") return e.reps;
  if(e.role==="main") return Math.max(3, e.reps+W.repShift);
  return Math.max(6, e.reps+W.repShift);
};
const restFor=(e,wi)=>Math.round(e.rest*WEEKS[wi].restMul);
function estMinutes(s,wi){
  let t=s.warm.reduce((a,w)=>a+w.d,0)+20;
  s.work.forEach(e=>{
    const n=setsFor(e,wi,s);
    let w=e.role==="hold"?e.reps:Math.max(24,repsFor(e,wi)*3.2);
    if(e.side) w*=2;
    t+=25+n*w+(n-1)*restFor(e,wi);
  });
  t+=20+s.fin.rounds*(s.fin.work+s.fin.rest);
  t+=s.cool.reduce((a,w)=>a+w.d,0)+12;
  return Math.round(t/60);
}
function musclesOf(s){ const o=[]; s.work.forEach(e=>e.mus.forEach(m=>{if(!o.includes(m))o.push(m);})); return o; }

/* ============================================================
   STORE — remembers your loads so you can beat them next week.
   Degrades to memory-only if storage is unavailable.
   ============================================================ */
const STORE=(()=>{
  const KEY="saratoga.v3"; let mem={}, ok=true;
  try{ const raw=localStorage.getItem(KEY); mem=raw?JSON.parse(raw):{}; }catch(e){ ok=false; mem={}; }
  const save=()=>{ if(!ok) return; try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){ ok=false; } };
  return {
    ok:()=>ok,
    get(wi,sk,en){ return (mem[sk]&&mem[sk][en]&&mem[sk][en][wi])||null; },
    best(sk,en,beforeWeek){ // most recent record at or before the previous week
      const r=mem[sk]&&mem[sk][en]; if(!r) return null;
      for(let w=beforeWeek-1; w>=0; w--) if(r[w]) return Object.assign({week:w},r[w]);
      return null;
    },
    put(wi,sk,en,rec){ mem[sk]=mem[sk]||{}; mem[sk][en]=mem[sk][en]||{}; mem[sk][en][wi]=rec; save(); },
    doneSets(wi,sk,en){ const r=this.get(wi,sk,en); return r?r.sets.length:0; },
    sessionDone(wi,sk){ const r=mem[sk]; if(!r) return false;
      const s=SESSIONS.find(x=>x.key===sk); if(!s) return false;
      return s.work.every(e=>{ const g=r[e.n]&&r[e.n][wi]; return g&&g.sets.length>=setsFor(e,wi,s); }); },
    wipe(){ mem={}; save(); },
  };
})();

const AUDIO={ctx:null,gain:null,vol:0.9,on:true,voice:true,ready:false};
function audioInit(){
  try{
    if(!AUDIO.ctx){
      AUDIO.ctx=new (window.AudioContext||window.webkitAudioContext)();
      AUDIO.gain=AUDIO.ctx.createGain(); AUDIO.gain.gain.value=AUDIO.vol;
      AUDIO.gain.connect(AUDIO.ctx.destination);
    }
    if(AUDIO.ctx.state!=="running") AUDIO.ctx.resume();
    const b=AUDIO.ctx.createBufferSource(); b.buffer=AUDIO.ctx.createBuffer(1,1,22050);
    b.connect(AUDIO.gain); b.start(0);
    AUDIO.ready=(AUDIO.ctx.state==="running");
  }catch(e){ AUDIO.ready=false; }
  return AUDIO.ready;
}
["pointerdown","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,
  ()=>{ if(AUDIO.ctx&&AUDIO.ctx.state!=="running") AUDIO.ctx.resume(); },{passive:true}));
function tone(freq,dur,when,punch){
  if(!AUDIO.ctx||!AUDIO.on) return;
  const t=AUDIO.ctx.currentTime+(when||0);
  [["square",freq,0.60],["sine",freq*2,0.32]].forEach(([type,f,mix])=>{
    const o=AUDIO.ctx.createOscillator(), g=AUDIO.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    const peak=Math.max(0.0002,(punch||1)*mix);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AUDIO.gain); o.start(t); o.stop(t+dur+0.04);
  });
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
function speak(t){ if(!AUDIO.voice||!("speechSynthesis" in window)||!t) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.06; u.volume=1; speechSynthesis.speak(u);}catch(e){} }
function scheduleCountdown(left){
  if(!AUDIO.ctx||!AUDIO.on) return;
  for(let n=5;n>=1;n--){ const w=left-n; if(w>0.04) tone(n===1?1245:932,n===1?0.20:0.14,w,n===1?1.05:0.85); }
}
const cueGo=()=>{tone(1046,0.17,0,1.15);tone(1568,0.46,0.16,1.25);buzz([90,60,150]);};
const cueRest=()=>{tone(587,0.36,0,0.95);buzz([80]);};
const cueTick=()=>{tone(784,0.22,0,0.9);buzz([60,50,60]);};
const cueDone=()=>{tone(784,0.18,0,1);tone(1046,0.18,0.18,1);tone(1568,0.55,0.36,1.15);buzz([120,80,120,80,240]);};

const curEx=()=>S.sess.work[S.queue[S.qi]];

function startRun(i){
  audioInit(); if(AUDIO.gain)AUDIO.gain.gain.value=AUDIO.vol;
  pFigs.forEach(f=>f.stop()); pFigs=[];
  S.sess=SESSIONS[i]; S.phase="warm"; S.tIdx=0; S.qi=0; S.set=1; S.resting=false;
  S.queue=S.sess.work.map((_,k)=>k); S.log=[]; S.finRound=1; S.t0=Date.now();
  S.left=S.sess.warm[0].d;
  document.getElementById("run").classList.add("on");
  keepAwake(); paint(); cueTick(); speak("Warm-up. "+S.sess.warm[0].n);
  clearInterval(S.tick);
  let last=Date.now();
  S.tick=setInterval(()=>{
    const now=Date.now(); const dt=(now-last)/1000; last=now;
    const timed=(S.phase==="warm"||S.phase==="cool"||S.phase==="fin"||(S.phase==="work"&&S.resting));
    if(!timed) return;
    S.left-=dt;
    const sec=Math.ceil(S.left);
    if(sec<=5&&sec>=1&&sec!==S.spoke){
      S.spoke=sec;
      if(AUDIO.voice&&S.phase!=="fin") speak(String(sec));
      const st=document.getElementById("stage"); st.classList.add("pulse");
      setTimeout(()=>st.classList.remove("pulse"),470);
    }
    if(S.left<=0){ timerDone(); return; }
    paintClock();
  },100);
}

function timerDone(){
  if(S.phase==="warm"){
    S.tIdx++;
    if(S.tIdx<S.sess.warm.length){ S.left=S.sess.warm[S.tIdx].d; S.spoke=null;
      cueTick(); speak(S.sess.warm[S.tIdx].n); paint(); }
    else { S.phase="work"; S.qi=0; S.set=1; S.resting=false; S.spoke=null;
      cueGo(); speak("Warm-up done. First exercise, "+curEx().n); paint(); }
    return;
  }
  if(S.phase==="work"){ // rest finished
    S.resting=false; S.spoke=null; cueGo();
    speak("Go. Set "+S.set+" of "+setsFor(curEx(),S.week,S.sess)); paint(); return;
  }
  if(S.phase==="fin"){
    const f=S.sess.fin;
    if(S.finPhase==="work"){
      if(S.finRound>=f.rounds){                      // last work interval finished
        S.phase="cool"; S.tIdx=0; S.left=S.sess.cool[0].d; S.spoke=null;
        cueTick(); speak("Cool-down. "+S.sess.cool[0].n); paint(); return;
      }
      S.finPhase="rest"; S.left=f.rest; S.spoke=null;
      cueRest(); speak("Rest"); scheduleCountdown(S.left); paint(); return;
    }
    S.finRound++; S.finPhase="work"; S.left=f.work; S.spoke=null;
    cueGo(); speak("Round "+S.finRound+" of "+f.rounds); scheduleCountdown(S.left); paint(); return;
  }
  if(S.phase==="cool"){
    S.tIdx++;
    if(S.tIdx<S.sess.cool.length){ S.left=S.sess.cool[S.tIdx].d; S.spoke=null; cueTick(); speak(S.sess.cool[S.tIdx].n); paint(); }
    else finish();
  }
}

function setDone(){
  const e=curEx(), n=setsFor(e,S.week,S.sess);
  S.log.push({ex:e.n,set:S.set,weight:S.weight,reps:S.reps});
  const rec=STORE.get(S.week,S.sess.key,e.n)||{sets:[],top:0};
  rec.sets=rec.sets.filter(x=>x.set!==S.set);
  rec.sets.push({set:S.set,weight:S.weight,reps:S.reps});
  rec.sets.sort((a,b)=>a.set-b.set);
  rec.top=Math.max(...rec.sets.map(x=>x.weight),0);
  STORE.put(S.week,S.sess.key,e.n,rec);
  if(S.set>=n){ nextExercise(true); }
  else { S.set++; S.resting=true; S.left=restFor(e,S.week); S.spoke=null;
    cueRest(); speak("Rest "+restFor(e,S.week)+" seconds. Set "+S.set+" next.");
    scheduleCountdown(S.left); paint(); }
}

function nextExercise(completed){
  if(completed) S.queue.splice(S.qi,1); else S.qi++;
  if(S.qi>=S.queue.length) S.qi=0;
  if(S.queue.length===0){ startFinisher(); return; }
  S.set=1; S.resting=false; S.spoke=null;
  const e=curEx();
  const done=STORE.doneSets(S.week,S.sess.key,e.n);
  cueGo(); speak("Next. "+e.n+". "+setsFor(e,S.week,S.sess)+" sets of "+repsFor(e,S.week));
  paint();
}
function deferExercise(){
  if(S.queue.length<=1){ speak("Nothing else to move to."); paint(); return; }
  const id=S.queue.splice(S.qi,1)[0];
  S.queue.push(id);
  if(S.qi>=S.queue.length) S.qi=0;
  S.set=1; S.resting=false; S.spoke=null;
  cueTick(); speak("Moved to the end. Next, "+curEx().n);
  paint();
}
function startFinisher(){
  S.phase="fin"; S.finRound=1; S.finPhase="work"; S.left=S.sess.fin.work; S.spoke=null;
  cueGo(); speak("Strength done. Cardio finisher. "+S.sess.fin.n); paint();
}

/* ---------- painting ---------- */
function paintClock(){
  const c=document.getElementById("rClock");
  const timed=(S.phase!=="work")||S.resting;
  c.textContent = timed ? mmss(Math.max(0,Math.ceil(S.left))) : "";
  c.style.color = S.resting||S.phase==="cool" ? "var(--p20)" : S.phase==="fin" ? "var(--p10)" : "var(--p15)";
}
function paintPips(){
  const box=document.getElementById("rPips");
  const total=S.sess.work.length;
  let html="";
  for(let k=0;k<total;k++){
    const inQ=S.queue.indexOf(k);
    let cls="pip";
    if(inQ===-1) cls+=" on";
    else if(inQ===S.qi && S.phase==="work") cls+=" cur";
    else if(inQ>S.qi) cls+=" ";
    html+=`<div class="${cls}"></div>`;
  }
  box.innerHTML=html;
}
function paint(){
  const g=id=>document.getElementById(id);
  paintPips();
  const logger=g("rLogger"), main=g("bMain");
  logger.style.display="none"; main.className="primary";
  g("rDots").innerHTML=""; g("rLast").textContent=""; g("rTarget").textContent="";
  if(S.phase==="warm"||S.phase==="cool"){
    const list=S.phase==="warm"?S.sess.warm:S.sess.cool, it=list[S.tIdx];
    g("rHead").textContent=(S.phase==="warm"?"Warm-up · ":"Cool-down · ")+(S.tIdx+1)+" of "+list.length;
    g("rState").textContent=S.phase==="warm"?"Warm-up":"Cool-down";
    g("rState").style.color="var(--p15)";
    g("rName").textContent=it.n; g("rCue").textContent=it.c;
    main.textContent="Skip ahead"; main.className="primary dim";
    setFig(it.n);
  } else if(S.phase==="fin"){
    const f=S.sess.fin;
    g("rHead").textContent="Cardio finisher · round "+Math.min(S.finRound,f.rounds)+" of "+f.rounds;
    g("rState").textContent=S.finPhase==="work"?"Work":"Rest";
    g("rState").style.color=S.finPhase==="work"?"var(--p10)":"var(--muted)";
    g("rName").textContent=f.n; g("rCue").textContent=f.cue;
    main.textContent="Skip ahead"; main.className="primary dim";
    setFig(f.n);
  } else {
    const e=curEx(), n=setsFor(e,S.week,S.sess), r=repsFor(e,S.week);
    g("rHead").textContent="Exercise "+(S.sess.work.length-S.queue.length+1)+" of "+S.sess.work.length+" · "+S.sess.title;
    g("rState").textContent=S.resting?"Rest":"Work";
    g("rState").style.color=S.resting?"var(--p20)":`var(${S.sess.color})`;
    g("rName").textContent=e.n;
    g("rTarget").innerHTML = e.role==="hold"
      ? `Set ${S.set} of ${n} · <b>${r}s${e.side?" each side":""}</b>`
      : `Set ${S.set} of ${n} · <b>${r} reps${e.side?" each leg":""}</b> @ RPE ${WEEKS[S.week].rpe}`;
    let dots=""; for(let k=1;k<=n;k++) dots+=`<div class="sd ${k<S.set?"on":k===S.set?"cur":""}"></div>`;
    g("rDots").innerHTML=dots;
    const last=STORE.best(S.sess.key,e.n,S.week);
    g("rLast").textContent = last ? `Week ${last.week+1}: ${last.top} kg top set — beat it`
      : (STORE.ok()? "No history yet — this becomes your baseline" : "");
    g("rCue").textContent=S.resting?("Next up: set "+S.set+" of "+n):e.cue;
    if(!S.resting && e.role!=="hold"){
      logger.style.display="flex";
      if(S.reps===0) S.reps=r;
      if(last && S.set===1 && S.weight===20) S.weight=last.top||20;
      g("wVal").textContent=S.weight; g("rVal").textContent=S.reps;
    }
    main.textContent=S.resting?"Skip rest":"Set done";
    main.className=S.resting?"primary rest":"primary";
    setFig(e.n);
  }
  paintClock();
}
function setFig(name){
  const key=patternFor(name), sv=document.getElementById("runDemo");
  if(S.fig) S.fig.stop();
  if(key) S.fig=mkFigure(sv,key,{scale:0.60,ox:110,oy:132}); else { sv.innerHTML=""; S.fig={stop(){}}; }
}
function finish(){
  clearInterval(S.tick); releaseAwake(); cueDone(); speak("Session complete. Well done.");
  if(S.fig) S.fig.stop();
  const s=S.sess, el=document.getElementById("app");
  document.getElementById("run").classList.remove("on");
  const byEx={}; S.log.forEach(l=>{ (byEx[l.ex]=byEx[l.ex]||[]).push(l); });
  const mins=Math.round((Date.now()-S.t0)/60000);
  el.innerHTML=`<div class="end"><div class="eyebrow">Week ${S.week+1} · ${s.day} · ${mins} min</div>
    <h2>${s.title} done.</h2>
    <p>${STORE.ok()?"Saved. Next week this page shows you what to beat.":"Storage is unavailable here, so copy this down before you close it."}</p>
    <div class="logtable">${Object.keys(byEx).length?Object.keys(byEx).map(k=>
      `<div class="lr"><b>${k}</b><span>${byEx[k].map(x=>x.weight+"×"+x.reps).join("  ·  ")}</span></div>`).join("")
      :`<div class="lr"><b>No sets logged</b><span>—</span></div>`}</div>
    <button class="start" id="cp">Copy the log</button>
    <button class="btnwide" id="hm">Back to sessions</button></div>`;
  el.querySelector("#hm").onclick=()=>{renderHome();window.scrollTo(0,0);};
  el.querySelector("#cp").onclick=()=>{
    const txt=`${s.title} — week ${S.week+1}\n`+Object.keys(byEx).map(k=>
      `${k}: `+byEx[k].map(x=>x.weight+"kg x "+x.reps).join(", ")).join("\n");
    try{ navigator.clipboard.writeText(txt); el.querySelector("#cp").textContent="Copied"; }
    catch(e){ el.querySelector("#cp").textContent="Copy failed — screenshot it"; }
  };
}

/* ---------- controls ---------- */
document.getElementById("bMain").onclick=()=>{
  audioInit();
  if(S.phase==="warm"||S.phase==="cool"||S.phase==="fin"){ S.left=0.01; timerDone(); return; }
  if(S.resting){ S.resting=false; S.spoke=null; cueGo();
    speak("Go. Set "+S.set+" of "+setsFor(curEx(),S.week,S.sess)); paint(); return; }
  setDone();
};
document.getElementById("bSkip").onclick=()=>{
  if(S.phase==="work"){ if(S.queue.length<=1){ startFinisher(); S.queue=[]; return; } nextExercise(true); }
  else { S.left=0.01; timerDone(); }
};
document.getElementById("bDefer").onclick=()=>{ if(S.phase==="work") deferExercise(); };
document.getElementById("bPrev").onclick=()=>{
  if(S.phase==="work"&&S.set>1){ S.set--; S.resting=false; S.spoke=null; paint(); }
  else if(S.phase==="warm"&&S.tIdx>0){ S.tIdx--; S.left=S.sess.warm[S.tIdx].d; S.spoke=null; paint(); }
  else if(S.phase==="cool"&&S.tIdx>0){ S.tIdx--; S.left=S.sess.cool[S.tIdx].d; S.spoke=null; paint(); }
};
document.getElementById("bQuit").onclick=()=>{
  clearInterval(S.tick); releaseAwake(); if(S.fig)S.fig.stop();
  try{speechSynthesis.cancel();}catch(e){}
  document.getElementById("run").classList.remove("on"); renderHome(); window.scrollTo(0,0);
};
const step=(k,d)=>{ if(k==="w"){ S.weight=Math.max(0,Math.round((S.weight+d)*4)/4); document.getElementById("wVal").textContent=S.weight; }
  else { S.reps=Math.max(0,S.reps+d); document.getElementById("rVal").textContent=S.reps; } };
document.getElementById("wUp").onclick=()=>step("w",2.5);
document.getElementById("wDown").onclick=()=>step("w",-2.5);
document.getElementById("rUp").onclick=()=>step("r",1);
document.getElementById("rDown").onclick=()=>step("r",-1);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&S.sess){ keepAwake(); audioInit(); } });
renderHome();
</script>
</body>
