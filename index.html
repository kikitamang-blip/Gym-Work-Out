<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saratoga Block — 8 Weeks</title>
<style>
:root{--bg:#12141A;--surface:#1B1E26;--s2:#242832;--line:#2E3340;--text:#E9EAEE;--muted:#8B90A0;
--p25:#D93B3B;--p20:#2E7BC4;--p15:#E0AC26;--p10:#2FA35C;--eq:#6E92C4;
--mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:radial-gradient(120% 60% at 50% -10%,rgba(224,172,38,.07),transparent 60%),
            radial-gradient(90% 50% at 0% 100%,rgba(46,123,196,.06),transparent 60%)}
body{min-height:100dvh;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--p15);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 44px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
header.mast{padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.mast h1{font-size:27px;line-height:1.06;margin:8px 0 7px;font-weight:800;letter-spacing:-.035em;
 background:linear-gradient(180deg,#fff,#B9BECC);-webkit-background-clip:text;background-clip:text;
 -webkit-text-fill-color:transparent}
.mast p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.weeks{display:flex;gap:6px;margin:16px 0 8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:44px;padding:10px 6px;border-radius:9px;background:var(--surface);text-align:center;
font-family:var(--mono);font-size:15px;color:var(--muted);border:1px solid transparent}
.wk b{display:block;font-size:9px;letter-spacing:.12em;margin-top:2px;opacity:.75}
.wk.sel{background:linear-gradient(180deg,#2C313D,#242832);color:var(--text);border-color:var(--p15);
 box-shadow:0 0 0 1px rgba(224,172,38,.25),0 4px 14px rgba(0,0,0,.35)}
.note{font-size:12.5px;color:var(--muted);margin:2px 0 18px;line-height:1.5}.note b{color:var(--text)}
.day{width:100%;text-align:left;background:linear-gradient(180deg,#1D212A,#181B23);border-radius:15px;
 padding:15px 16px;margin-bottom:10px;border:1px solid var(--line);display:block;position:relative;overflow:hidden;
 box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.28);transition:transform .12s ease}
.day::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,transparent);opacity:.85}
.day:active{transform:scale(.988)}
.day:active{background:var(--s2)}
.day .top{display:flex;align-items:center;gap:9px}
.day .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:4px;color:#0E1014;font-weight:700}
.day .ok{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--p10)}
.day h3{font-size:17.5px;margin:9px 0 5px;font-weight:700;letter-spacing:-.015em}
.day p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;
 border-radius:99px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);color:var(--muted)}
.meta{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:14px 0}
.panel h4{margin:0 0 3px;font-size:14px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.lvl{padding:11px 4px;border-radius:10px;background:var(--s2);border:1px solid var(--line);
 font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lvl.sel{background:linear-gradient(180deg,#33394A,#272C38);color:var(--text);border-color:var(--p15);
 box-shadow:0 0 0 1px rgba(224,172,38,.25)}.panel .sub{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.optrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.optrow:first-of-type{border-top:0}.optrow .lbl{flex:1;font-size:13.5px}
.optrow .lbl span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.sw{flex:0 0 48px;height:28px;border-radius:14px;background:var(--s2);border:1px solid var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.sw[aria-pressed="true"]{background:rgba(224,172,38,.22);border-color:var(--p15)}
.sw[aria-pressed="true"]::after{transform:translateX(20px);background:var(--p15)}
input[type=range]{width:100%;accent-color:var(--p15);margin:8px 0 2px}
.btnwide{width:100%;padding:12px;border-radius:9px;background:var(--s2);border:1px solid var(--line);
font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text);margin-top:8px}
.snd{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:10px;color:var(--muted)}
.snd b{color:var(--p10)}.snd.warn b{color:var(--p15)}
.back{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 0}
.sec{margin:20px 0}
.sech{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sech .dot{width:11px;height:11px;border-radius:2px}
.sech h4{margin:0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.sech .fmt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.secsub{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.45}
.ex{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.ex .th{flex:0 0 58px;height:58px;background:var(--bg);border-radius:8px;border:1px solid var(--line);overflow:hidden}
.ex .b{flex:1;min-width:0}
.ex .b strong{font-size:15px;font-weight:600;display:block}
.ex .b .pre{font-family:var(--mono);font-size:12px;color:var(--p15);margin-top:3px}
.ex .b .cue{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.ex .b .sw2{font-size:11.5px;color:var(--eq);margin-top:4px;line-height:1.4}
.ex .r{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:3px;text-align:right}
.start{position:sticky;bottom:14px;width:100%;padding:17px;border-radius:14px;background:linear-gradient(180deg,#E2483F,#C22F2F);color:#fff;
font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono);margin-top:24px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.modal{position:fixed;inset:0;background:rgba(8,9,12,.76);display:none;z-index:60;align-items:flex-end}
.modal.on{display:flex}
.mc{background:var(--surface);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;border-top:1px solid var(--line);
padding:16px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.mc .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.mc h3{margin:0 0 4px;font-size:20px}
.mc .kind{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.demo{background:var(--bg);border:1px solid var(--line);border-radius:12px;height:230px;margin:13px 0;display:block;width:100%}
.steps{list-style:none;padding:0;margin:4px 0 0;counter-reset:s}
.steps li{position:relative;padding:9px 0 9px 30px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;font-family:var(--mono);font-size:11px;color:var(--p15)}
.cuebox{font-size:13px;color:var(--muted);line-height:1.55;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.yt{display:block;text-align:center;margin-top:13px;padding:13px;border-radius:9px;background:#7A1414;color:#fff;
text-decoration:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}
.swopt{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.swopt .th{flex:0 0 54px;height:54px;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.swopt b{flex:1;font-size:15px;font-weight:600}
.swopt .go{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--p15);text-transform:uppercase}
#run{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50}
#run.on{display:flex}
.rtop{padding:11px 16px 0}
.rtop .row{display:flex;align-items:center;gap:10px}
.rtop .row .eyebrow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quit{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding:6px 2px}
.blocks{display:flex;gap:5px;margin:10px 0 2px}
.ovr{display:flex;align-items:center;gap:10px;margin:9px 0 2px}
.ovr .track{flex:1;height:4px;border-radius:3px;background:var(--s2);overflow:hidden}
.ovr .track i{display:block;height:100%;width:0;border-radius:3px;
 background:linear-gradient(90deg,var(--p20),var(--p10));transition:width .3s ease}
.ovr .txt{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ovr .txt b{color:var(--text);font-weight:700}
.bl{flex:1;text-align:center}
.bl i{display:block;height:5px;border-radius:3px;background:var(--s2);overflow:hidden;position:relative}
.bl i b{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--p10);
 transition:width .25s ease}
.bl.cur i b{background:var(--p15)}
.bl span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bl.cur span{color:var(--text)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 18px;text-align:center;min-height:0;overflow:hidden}
.state{font-family:var(--mono);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:700}
.exn{font-size:clamp(19px,5.8vw,27px);font-weight:750;line-height:1.12;letter-spacing:-.02em;margin:5px 0 0;max-width:18ch}
#demo{width:100%;max-width:300px;height:clamp(104px,20vh,164px)}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.05em;font-size:clamp(50px,16vw,90px);line-height:.92;margin:0}
.tgt{font-family:var(--mono);font-size:14.5px;margin-top:3px}.tgt b{color:var(--p15)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.sd{width:9px;height:9px;border-radius:50%;background:var(--s2);border:1px solid var(--line)}
.sd.on{background:var(--p10);border-color:var(--p10)}.sd.cur{background:var(--p15);border-color:var(--p15)}
.small{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px}
.cue{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.45;max-width:32ch}
.why{font-size:12.5px;line-height:1.5;color:#C9CEDA;margin-top:11px;max-width:34ch;
 border-left:2px solid var(--p15);padding-left:11px;text-align:left}
.why b{color:var(--p15);font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
 text-transform:uppercase;display:block;margin-bottom:3px;font-weight:700}
.stage.pulse .clock{animation:beat .5s ease-in-out}
@keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.stage.pulse .clock{animation:none}}
.ctrls{padding:8px 16px calc(13px + env(safe-area-inset-bottom))}
.prim{width:100%;padding:18px;border-radius:14px;background:linear-gradient(180deg,#37B368,#279253);color:#04140A;font-size:16px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:16px;
letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.prim.rest{background:linear-gradient(180deg,#3A8BD4,#2467A8);color:#fff}.prim.dim{background:var(--s2);color:var(--text)}
.srow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.sbtn{padding:13px 1px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);
font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sbtn:active{background:var(--s2)}
.sbtn.vid{color:#E58C8C;border-color:#4A2A2A}.sbtn.swp{color:var(--eq);border-color:#33415A}
#cd{position:fixed;inset:0;background:rgba(10,11,14,.96);display:none;z-index:70;align-items:center;justify-content:center;flex-direction:column}
#cd.on{display:flex}
#cd .n{font-family:var(--mono);font-size:clamp(110px,34vw,220px);font-weight:800;line-height:1;color:var(--p15)}
#cd .l{font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:10px}
#pz{position:fixed;inset:0;background:rgba(10,11,14,.97);display:none;z-index:65;align-items:center;justify-content:center;flex-direction:column;padding:24px}
#pz.on{display:flex}
#pz h2{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
#pz .t{font-family:var(--mono);font-size:15px;color:var(--muted);margin-bottom:26px}
#pz .b{width:100%;max-width:340px}
#pz .b button{width:100%;margin-bottom:9px}
.end{text-align:center;padding:32px 20px}
.end h2{font-size:27px;margin:12px 0 8px}
.end p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 auto;max-width:32ch}
.lt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin:20px 0;text-align:left}
.lt .lr{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.lt .lr:first-child{border-top:0}.lt .lr b{flex:1;font-weight:600}
.lt .lr span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hero{width:100%;text-align:left;display:block;position:relative;overflow:hidden;margin:2px 0 6px;
 padding:18px 18px 16px;border-radius:18px;border:1px solid rgba(224,172,38,.35);
 background:linear-gradient(150deg,rgba(224,172,38,.14),rgba(27,30,38,.9) 46%,#1B1E26);
 box-shadow:0 10px 34px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.05) inset;transition:transform .12s ease}
.hero:active{transform:scale(.99)}
.hero .lab{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--p15);font-weight:700}
.hero h2{margin:9px 0 5px;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.hero p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.hero .go{display:flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--mono);font-size:11.5px;
 letter-spacing:.16em;text-transform:uppercase;color:var(--text);font-weight:700}
.hero .go i{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--p15);color:#12141A;
 display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.divider span{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.divider i{flex:1;height:1px;background:var(--line)}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
footer b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="run">
  <div class="rtop"><div class="row"><div class="eyebrow" id="rh">—</div><button class="quit" id="bq">End</button></div>
    <div class="blocks" id="rb"></div>
    <div class="ovr"><div class="track"><i id="ovf"></i></div>
      <div class="txt"><b id="ovp">0%</b> · <span id="ovl">—</span></div></div></div>
  <div class="stage" id="stage">
    <div class="state" id="rs">—</div><div class="exn" id="rn">—</div>
    <svg id="demo" viewBox="0 0 220 150" aria-hidden="true"></svg>
    <div class="clock num" id="rc"></div><div class="tgt" id="rt"></div>
    <div class="dots" id="rd"></div><div class="small" id="rl"></div><div class="cue" id="rq"></div>
    <div class="why" id="rw"></div>
  </div>
  <div class="ctrls"><button class="prim" id="bm">Set done</button>
    <div class="srow"><button class="sbtn" id="bb">◀ Back</button><button class="sbtn" id="bp">Pause</button>
      <button class="sbtn swp" id="bs">Swap</button><button class="sbtn vid" id="bv">Video</button>
      <button class="sbtn" id="bk">Skip ▶</button></div></div>
</div>
<div id="cd"><div class="n num" id="cdn">3</div><div class="l" id="cdl">Get ready</div></div>
<div id="pz"><h2>Paused</h2><div class="t num" id="pzt">0:00 elapsed</div><div class="t" id="pzn" style="color:var(--text);margin-top:-18px"></div>
  <div class="b"><button class="prim" id="pzr">Resume</button>
    <button class="btnwide" id="pzv">Watch this exercise on YouTube</button>
    <button class="btnwide" id="pze">End session</button></div></div>
<div class="modal" id="md"><div class="mc" id="mcc"></div></div>
<script>

const WHY={"ghd_raise":"The single best hamstring builder there is — it trains them at the knee and the hip at once, which no machine does.","ghd_ext":"Loads the whole back chain through a bigger range than the 45-degree bench, and it is the best lower-back builder you have.","abwheel":"The hardest anti-extension exercise in the building — a genuinely stronger midsection than any crunch will give you.","pigeon":"The most effective glute and deep hip opener there is — exactly what squatting and hinging tighten.","ninety":"Restores both internal and external hip rotation, the ranges every leg day quietly steals.","figure4":"Targets the deep glute and piriformis without loading the spine at all.","adductor":"Opens the inner thigh, which lunging and wide squatting shorten and nothing else stretches.","childpose":"Decompresses the spine and opens the lats — the simplest reset after a heavy pulling day.","thread":"Rotates the upper back, restoring the mobility that pressing and rowing progressively lock up.","wrist":"Carries and heavy grip work load the forearms hard; this is what keeps elbows and wrists healthy.","tricepstr":"Restores overhead reach after pressing volume, and takes tension off the elbow.","neckstr":"Carries and shrugs load the upper traps; releasing them is what stops tension headaches.","quadstand":"Direct quad and hip flexor length after squatting, with no floor work needed.","seatfold":"Lengthens the whole back chain at once — hamstrings, calves and lower back together.","cobra":"Opens the hip flexors and abdominals, undoing the flexed position most training puts you in.","squat_bar":"Loads the entire body through the legs and trunk — no lift drives whole-body muscle and bone density harder.","squat_smith":"Same quad and glute stimulus on a fixed path, so you can push closer to failure without a spotter.","squat_goblet":"Teaches a deep, upright squat while hammering quads and glutes, with almost no load on the spine.","squat_air":"Opens the knees and hips and grooves the pattern before you put weight on your back.","splitsquat":"One leg at a time exposes and then fixes the side-to-side imbalance every two-legged lift hides.","latlunge":"Trains the hips sideways — the plane almost everything else ignores, and where groin strains happen.","lunge_db":"Single-leg strength plus the balance and knee control you actually use on stairs and hills.","stepup":"Builds the exact drive you need to climb, one leg at a time, with no spinal loading.","legpress":"Heavy quad and glute volume with the back supported — safe loading when you are already tired.","legext":"Isolates the quads near full extension, the range squats never really reach.","legcurl":"Direct hamstring work that balances all the quad-dominant lifting and protects the knee.","calfraise":"Calves absorb your bodyweight every single step — direct work keeps ankles and Achilles robust.","calfpress":"Heavy calf loading through a full stretch, which is where the growth and the tendon health come from.","hipthrust":"The most direct glute loading there is: stronger hip drive and a lower back that stops compensating.","glutebridge":"Switches the glutes on so your hamstrings and lower back stop doing their job for them.","rdl_bar":"Builds hamstrings, glutes and the whole back chain — the best lower-back insurance you can train.","rdl_db":"Hamstring and glute length under load, with each side working independently.","backext":"Strengthens the spinal erectors, which is exactly what makes heavy hinging and carrying safe.","swing_kb":"Explosive hip power and a serious conditioning hit in the same movement.","bench_bar":"The main upper-body pressing strength lift — chest, front shoulders and triceps under real load.","bench_smith":"Chest and triceps loading on a fixed path, so you can chase reps safely on your own.","bench_db":"Each arm works alone and the shoulders move through a bigger range than a barbell allows.","chestpress":"Chest volume with zero balance demand — the safest way to add pressing work when fatigued.","dip":"One of the best chest and triceps builders going, and it loads the shoulder through a big range.","pushup":"Chest and triceps with the trunk working hard to hold one straight line head to heel.","ohp_bar":"Overhead strength plus a trunk that has to stop you leaning back — it carries over to everything.","ohp_db":"Shoulder size and strength with each arm honest, and no way to cheat with the stronger side.","ohp_mach":"Straightforward shoulder volume with the back supported, so nothing else has to stabilise.","pushpress":"Teaches your legs and shoulders to fire together — power you can actually use.","thruster":"Squat and press in one breath: the biggest bang-for-time movement in the whole programme.","latraise":"Builds the side of the shoulder that pressing misses — the muscle that makes shoulders look broad.","fly_cable":"Stretches and squeezes the chest through a range no press can reach.","extrot":"Keeps the rotator cuff strong, which is what stops pressing volume turning into shoulder pain.","pullapart":"Wakes up the upper back so your shoulders sit properly before you load them.","curl_mach":"Direct biceps work with the arms fixed, so nothing else can help.","curl_db":"Elbow strength and arm size that rows alone will never give you.","pushdown":"Triceps are two thirds of your arm — this trains them and every lockout you own.","tricepsext":"Loads the triceps in the stretched overhead position, where they grow the most.","pulldown":"Lat and biceps work with adjustable load, so you can train the pattern before you can chin.","chinup":"The best upper-back and biceps builder there is, and a genuinely useful strength to own.","row_cable":"Builds the mid-back that holds your posture up and balances every press you do.","row_db":"Each side rows independently, so the stronger lat cannot cover for the weaker one.","facepull":"Rear shoulders and upper back — the single best insurance against pressing-heavy shoulders.","farmercarry":"Grip, traps and trunk under genuine load. The most transferable strength in the building.","suitcase":"Loading one side forces your obliques to stop you leaning — anti-rotation strength that protects the spine.","plank":"Teaches the trunk to hold a straight line under fatigue, which is what protects the back when you lift.","sideplank":"Trains the obliques and the side of the hip — the bit that stops you collapsing sideways.","hollow":"Builds the deep front core that keeps your ribs down and your lower back safe under load.","deadbug":"Trains you to move your limbs while the spine stays still — the whole point of core work.","rollout":"One of the hardest anti-extension exercises there is, and it builds a genuinely strong midsection.","crunch":"Works the abs through a full stretch over the ball, which a floor crunch cannot do.","balltwist":"Rotational strength through the ribs — the plane your trunk uses in almost every sport.","revcrunch":"Hits the lower abs by curling the hips, a movement the usual crunches skip entirely.","ballslam":"Full-body power and a brutal core hit, with the added bonus of getting the stress out.","pallof":"You resist a twist instead of making one — the most protective core strength you can build.","shouldertap":"Plank strength plus shoulder stability, and it teaches your hips not to rotate.","rowerg":"Full-body conditioning with no impact — legs, back and arms in one clean sequence.","ski":"Drives the lats and trunk hard while your heart rate climbs. Easy on the knees.","airbike":"Arms and legs together means nowhere to hide — the fastest way to raise your work capacity.","bike_up":"Steady, low-impact conditioning that flushes the legs without adding fatigue.","crosstrainer":"Full-body cardio with no joint impact — ideal on the days your legs are already cooked.","treadmill":"Incline walking builds the aerobic base and the calves without the pounding of running.","walk":"Active recovery: moves blood through the muscles you trained without adding any stress.","rope":"Shoulders, trunk and lungs at once. The best fat-loss finisher in this gym.","burpee":"Every muscle and your whole cardiovascular system in one rep. Nothing warms you up faster.","jumpsquat":"Wakes up the fast-twitch fibres so the heavy sets that follow feel sharper.","highknees":"Raises the heart rate fast and takes the hips through full range before you load them.","legflick":"Warms the hamstrings through their whole range so they are ready to hinge.","jumpjack":"Gets blood into the shoulders and lifts the heart rate with almost no joint stress.","mtclimber":"Trunk under load with the hips moving — warms your core and your lungs together.","breathing":"Drops your heart rate and shifts you out of stress mode so you actually recover from the session.","foamroll":"Restores tissue quality and blood flow, which is what lets you train hard again tomorrow.","couchstr":"Opens the hip flexors and quads that squatting and sitting both shorten.","hamstr":"Restores hamstring length after hinging, which is what keeps your lower back out of trouble.","pecstr":"Reopens the chest after pressing so your shoulders sit back where they belong.","latstr":"Lengthens the lats after pulling, which restores overhead reach.","calfstr":"Keeps the calves and Achilles supple, protecting the ankle and the knee above it.","hipflexor":"Undoes the shortening from sitting and single-leg work, and lets the glutes fire properly.","legswing":"Takes the hips through full range so the first heavy set is not the first deep rep.","armcircle":"Opens the shoulders through full circles before anything asks them to press.","wgs":"Hits hips, groin and upper back in one position — the most efficient stretch there is.","thoracic":"Opens the upper back over the ball, undoing the rounding that pressing and rowing create."};
const HOWTO={"ghd_raise":{"name":"Glute ham raise","steps":["Ankles locked between the rollers, thighs on the pad, body in one straight line.","Lower yourself forward slowly under control — this is the hard part and where the strength is built.","Pull yourself back up using the hamstrings. Push off the footplate for assistance early on."]},"ghd_ext":{"name":"GHD back extension","steps":["Hips just past the front edge of the pad, ankles secured, hands across the chest.","Hinge down until you feel the hamstrings, keeping the back flat throughout.","Come up until your body is one straight line and stop there — do not arch past it."]},"abwheel":{"name":"Ab wheel rollout","steps":["Kneel on a mat with the wheel under your shoulders, ribs pulled down.","Roll out only as far as you can stop the hips sagging — that range grows over weeks.","Pull back using your stomach, not your hip flexors. Stop the set the moment the low back arches."]},"pigeon":{"name":"Pigeon stretch","steps":["Front shin across the mat in front of you, back leg extended straight behind.","Keep the hips square — if you are tipping to one side, put a hand or a folded mat under that hip.","Walk the hands forward and sink the chest toward the floor. Breathe out into it."]},"ninety":{"name":"90/90 hip stretch","steps":["Sit with both knees bent at right angles, one leg in front and one out to the side.","Sit tall first, then lean the chest over the front shin.","Sixty seconds each way, then swap which leg is in front."]},"figure4":{"name":"Figure-four stretch","steps":["On your back, cross one ankle over the opposite thigh just above the knee.","Reach through the gap and pull the supporting thigh toward your chest.","Push the crossed knee gently away with your elbow to open the hip further."]},"adductor":{"name":"Adductor rock-back","steps":["On hands and knees, take one leg straight out to the side with the foot flat.","Keep the back flat and rock the hips backwards until you feel the inner thigh.","Rock in and out slowly rather than holding one position."]},"childpose":{"name":"Child's pose","steps":["Kneel, sit back onto your heels and walk the hands forward on the mat.","Let the chest sink toward the floor and the shoulders open.","For the lats, walk both hands over to one side and hold there."]},"thread":{"name":"Thread the needle","steps":["On hands and knees, slide one arm underneath your body along the floor.","Let that shoulder and the side of your head rest down.","Rotates the upper back, which is the bit pressing and rowing lock up."]},"wrist":{"name":"Wrist and forearm stretch","steps":["Arm straight out in front, palm down, and gently pull the fingers back toward you.","Then flip the palm up and repeat — both directions matter.","Essential after carries and heavy grip work."]},"tricepstr":{"name":"Overhead triceps stretch","steps":["Reach one arm overhead and drop the hand behind your neck.","Use the other hand on the elbow to pull gently back and in.","Sixty seconds each side after pressing volume."]},"neckstr":{"name":"Neck and upper trap stretch","steps":["Sit or stand tall, drop one ear toward the shoulder.","Rest that hand on the far side of your head for a little extra weight — no pulling.","Especially useful after carries and shrugging work."]},"quadstand":{"name":"Standing quad stretch","steps":["Hold something for balance, catch the ankle behind you and draw the heel to your backside.","Tuck the pelvis under and squeeze that glute — that is what makes it work.","Keep the knees together and the chest tall."]},"seatfold":{"name":"Seated forward fold","steps":["Sit with the legs straight out and the toes pointing up.","Hinge from the hips with a flat back, walking the hands down the legs.","Go where the hamstrings pull, not where your back rounds."]},"cobra":{"name":"Cobra / hip flexor opener","steps":["Lie face down with the hands under the shoulders.","Press the chest up while the hips stay on the mat.","Opens the front of the hips and the abdominals after heavy trunk work."]},"jumpsquat":{"name":"Jump squat","steps":["Quarter to half squat, arms swinging back.","Drive up and leave the floor, reaching tall.","Land soft through the whole foot with the knees bending — absorb it, don't thud."]},"highknees":{"name":"High knees","steps":["Run on the spot driving one knee to hip height at a time.","Stay tall through the chest, land on the balls of the feet.","Pump the arms. Fast feet beats high knees if you have to choose."]},"legflick":{"name":"Leg flicks","steps":["Jog on the spot flicking the heels up toward your backside.","Stay upright, knees pointing down, no leaning forward.","Quick and light — this is about turnover, not height."]},"jumpjack":{"name":"Jumping jacks","steps":["Feet together, arms at your sides.","Jump the feet wide as the arms sweep overhead.","Land soft and keep a rhythm you can hold for the whole interval."]},"mtclimber":{"name":"Mountain climbers","steps":["High plank, hands under the shoulders, hips level.","Drive one knee toward your chest and swap, fast.","The hips must not bounce up and down — that's the whole exercise."]},"shouldertap":{"name":"Plank shoulder taps","steps":["High plank with the feet a little wider than normal for stability.","Lift one hand and tap the opposite shoulder, then swap.","Do not let the hips rotate. Slow down until they stop moving."]},"ballslam":{"name":"Ball slam","steps":["Slam ball in both hands, reach it overhead and go up on the toes.","Slam it into the floor as hard as you can, hinging at the hips and following through.","Catch or pick it up and go straight into the next rep."]},"balltwist":{"name":"Slam ball twist","steps":["Sit on the mat, knees bent, heels light, leaning back slightly.","Hold the ball at your chest and rotate to touch it down beside one hip, then the other.","Rotate through the ribs, not by swinging the arms."]},"revcrunch":{"name":"Reverse crunch","steps":["Flat on the mat, hands by your sides, knees over the hips.","Curl the hips off the mat and bring the knees toward your face.","Lower slowly. This is a hip curl, not a leg swing."]},"thoracic":{"name":"Thoracic opener","steps":["Lie back over the big ball with the feet planted and hips supported.","Let the arms fall overhead and the upper back drape over the ball.","Breathe out and let the chest open. Thirty to sixty seconds."]},"bench_db":{"name":"Dumbbell bench press","steps":["Bells at the outside of the chest, wrists stacked over the elbows.","Press up and slightly together without clashing them at the top.","Shoulder blades stay pinned back into the bench throughout."]},"row_db":{"name":"Chest-supported dumbbell row","steps":["Chest on the incline bench, arm hanging straight down.","Drive the elbow up and back past your ribs, squeeze for a beat.","Let it hang fully at the bottom. No twisting the torso."]},"suitcase":{"name":"Suitcase carry","steps":["One heavy dumbbell in one hand, the other hand free.","Stand dead upright — do not lean away from the load. That resistance is the point.","Walk with short controlled steps, then swap sides."]},"dip":{"name":"Assisted dip","steps":["Hands on the dip handles, arms locked, lean the chest slightly forward.","Lower until the upper arms are about parallel to the floor — no deeper if the shoulders complain.","Press back up to a full lockout. Reduce the assistance as the weeks go on."]},"calfpress":{"name":"Calf press","steps":["On the leg press with the legs almost straight and only the balls of the feet on the platform.","Let the platform push the ankles back into a full stretch — that stretch is the whole point.","Press through the toes as far as the ankle will go and pause a second. Safety catches engaged."]},"ohp_bar":{"name":"Barbell overhead press","steps":["Bar at the collarbone, elbows just in front, feet under the hips.","Squeeze the glutes and brace hard — the trunk is what stops you leaning back.","Press up and slightly back so it finishes over the middle of your head, then lower under control."]},"pallof":{"name":"Pallof press","steps":["Stand side-on to the cable at chest height, hands together at the sternum.","Press straight out in front and hold. The cable will try to twist you — refuse.","Bring it back in slowly. Both sides, and the resistance stays honest only if you don't rotate."]},"latlunge":{"name":"Lateral lunge","steps":["Feet wide, toes pointing forward, a dumbbell held at the chest.","Push the hips back and sideways over one leg, letting that knee bend while the other stays straight.","Feel the stretch through the inner thigh, then drive back to the middle."]},"latraise":{"name":"Lateral raise","steps":["A light dumbbell in each hand, elbows very slightly bent.","Lead with the elbows and raise out to the sides until the arms are level with the shoulders.","Lower slowly. If you have to swing to move it, the weight is too heavy."]},"calfraise":{"name":"Calf raise","steps":["Stand with the balls of your feet on the edge of the step, holding a dumbbell.","Let the heels sink below the step for a full stretch.","Drive up onto the toes as high as you can and pause a second at the top."]},"hipthrust":{"name":"Hip thrust","steps":["Upper back on the bench, feet planted, weight across the hips.","Drive through the heels and squeeze the glutes hard to lift the hips level with the torso.","Tuck the ribs down. The movement comes from the hips, not the low back."]},"farmercarry":{"name":"Farmer carry","steps":["A heavy dumbbell in each hand, arms straight, shoulders pulled back.","Walk tall with short controlled steps. Don't lean away from the weight.","Grip is the point. Set them down when your hands give out, not your legs."]},"curl_db":{"name":"Dumbbell curl","steps":["Stand tall, elbows pinned to the sides, palms facing forward.","Curl up under control and squeeze at the top.","Lower slowly all the way to straight. No swinging from the hips."]},"tricepsext":{"name":"Overhead triceps extension","steps":["Seated with the back supported, one dumbbell held overhead in both hands.","Lower it behind your head by bending only at the elbow. Upper arms stay vertical.","Press back up to straight and squeeze the triceps."]},"facepull":{"name":"Face pull","steps":["Cable set at face height, a rope or handles in each hand, arms extended.","Pull toward your face, leading with the elbows and finishing with the hands beside your ears.","Squeeze the rear shoulders for a beat. Light weight, high reps."]},"splitsquat":{"name":"Bulgarian split squat","steps":["Back foot resting on the box, front foot far enough forward to stay vertical.","Lower straight down until the back knee is close to the floor.","Drive up through the front heel. All the work stays in the front leg."]},"squat_bar":{"name":"Back squat","steps":["Bar across the traps, not the neck. Feet shoulder width, toes turned out slightly.","Brace your stomach, break at the hips and knees together, knees tracking out over the toes.","Go as deep as you can hold a flat back, then drive the floor away — hips and chest rise together."]},"squat_smith":{"name":"Smith machine squat","steps":["Feet slightly forward of the bar so your hips can travel back into the rails.","Same depth as a free squat. The machine holds the path, so all you control is depth and tempo.","Unlock the hooks before you start and re-lock at the top of the last rep."]},"squat_goblet":{"name":"Goblet squat","steps":["One bell held against the chest, elbows tucked inside the knees at the bottom.","Stay far more upright than a barbell squat — the load is in front, so the chest stays tall.","Sit straight down between the heels, pause, then stand."]},"squat_air":{"name":"Bodyweight squat","steps":["Arms reach forward as a counterweight as you descend.","Slow on the way down, pause at the bottom, drive the knees out.","Full depth every rep — this is a warm-up, so quality over speed."]},"rdl_bar":{"name":"Romanian deadlift","steps":["Soft knees, then push the hips straight back. This is a hinge, not a squat.","Bar stays touching your legs the whole way down, back flat.","Stop when the hamstrings run out of length, then squeeze the glutes to stand tall."]},"rdl_db":{"name":"Dumbbell RDL","steps":["A dumbbell in each hand, resting against the front of the thighs.","Push the hips back and let the bells slide down the legs. Flat back throughout.","Drive the hips forward to stand. Don't lean back at the top."]},"swing_kb":{"name":"Kettlebell swing","steps":["Hike the bell back between the legs like a rugby pass — forearms against the thighs.","Snap the hips forward hard. The bell floats to chest height; your arms don't lift it.","Let it fall, absorb it with the hips, straight into the next rep."]},"backext":{"name":"Back extension","steps":["Pads just below the hip bones, heels locked under the roller.","Hinge down until you feel the hamstrings, back staying flat.","Squeeze the glutes to come up and stop in a straight line — don't arch past it."]},"glutebridge":{"name":"Glute bridge","steps":["Shoulders on the mat, knees bent, heels close to your backside.","Drive through the heels and squeeze the glutes to lift the hips.","Hold for a second at the top. Ribs stay down — don't arch the low back."]},"lunge_db":{"name":"Reverse lunge","steps":["A dumbbell in each hand. Step back and lower the back knee toward the floor.","Front shin stays close to vertical, torso upright, weight through the front heel.","Drive back up through the front leg without pushing off the back foot."]},"stepup":{"name":"Step-up","steps":["Whole front foot on the step — the heel must not hang off.","Drive through the front heel and stand fully tall at the top.","Lower slowly under control. No hopping off the trailing leg."]},"legpress":{"name":"Seated leg press","steps":["Feet mid-platform, about shoulder width, back flat against the pad.","Lower until the knees are around ninety degrees. Stop before the low back rounds off the seat.","Press through the whole foot and stop just short of locking the knees."]},"legext":{"name":"Leg extension","steps":["Knees lined up with the machine's pivot, pad sitting on the ankles.","Extend until the legs are straight and pause a full second at the top.","Lower slowly — don't let the stack bang down."]},"legcurl":{"name":"Leg curl","steps":["Pad just above the heels, thighs pinned to the seat.","Curl the heels down and back as far as the machine allows, and squeeze the hamstrings.","Two seconds to return. The hips stay put the whole set."]},"bench_bar":{"name":"Bench press","steps":["Shoulder blades pinned back and down, feet flat, safeties set at chest height.","Lower to the bottom of the sternum, elbows about forty-five degrees from the body.","Touch, then press up and slightly back toward your face."]},"bench_smith":{"name":"Smith machine bench","steps":["Set the bench so the bar path lands on your lower chest.","Same setup as a free bench — shoulders back and down, feet planted.","The rails hold the path, so control the tempo instead. Two seconds down."]},"chestpress":{"name":"Chest press machine","steps":["Set the seat so the handles start level with the middle of your chest.","Press out and squeeze hard at full extension.","Come back until you feel the chest stretch, then go again."]},"pushup":{"name":"Push-up","steps":["Hands under the shoulders, body in one straight line from head to heels.","Lower until the chest is a fist off the floor, elbows tucked to about forty-five degrees.","Press the floor away. Drop to the knees before the form goes."]},"ohp_db":{"name":"Dumbbell shoulder press","steps":["Seated with the back supported, bells at shoulder height, elbows slightly forward.","Ribs pulled down — don't arch the low back to get the weight up.","Press up and slightly back so it finishes over the middle of your head."]},"ohp_mach":{"name":"Shoulder press machine","steps":["Seat height so the handles start at shoulder level.","Press up without shrugging into your ears.","Stop just short of lockout to keep tension g with straight arms and the shoulders pulled down away from your ears.","Pull your chest toward the bar, not just your chin over it.","Lower all the way down. Reduce the assistance as the weeks go on."]},"row_cable":{"name":"Cable row","steps":["Chest tall, slight forward lean at the start, arms extended.","Pull to the belly button and squeeze the shoulder blades for a beat.","Return under control. Don't rock the torso to move the weight."]},"plank":{"name":"Plank","steps":["Elbows under the shoulders, forearms flat on the mat.","Squeeze the glutes and pull the ribs down so the hips don't sag.","Breathe normally. If the low back starts to ache, end the set."]},"sideplank":{"name":"Side plank","steps":["On one forearm, hips stacked, top arm reaching straight up.","Push the bottom hip up toward the ceiling and hold it there.","Match the time on both sides, even if the second side is harder."]},"hollow":{"name":"Hollow hold","steps":["Press the low back flat into the floor before you lift anything.","Lift the shoulders and legs, arms overhead if you can hold the position.","The moment the low back lifts off the floor, bend the knees or stop."]},"deadbug":{"name":"Dead bug","steps":["Low back flat, arms up, knees stacked over the hips.","Lower the opposite arm and leg slowly toward the floor.","Nothing moves in the low back. Return and swap sides."]},"rollout":{"name":"Swiss ball rollout","steps":["Kneel with the forearms on the ball, ribs pulled down.","Roll forward only as far as you can stop the hips sagging.","Pull back using your stomach, not your hip flexors."]},"crunch":{"name":"Swiss ball crunch","steps":["Low back supported on the ball, feet planted wide for balance.","Curl the ribs toward the hips. It's a short movement, not a sit-up.","Lower slowly and let the abs stretch back over the ball."]},"rowerg":{"name":"Rowing","steps":["Drive with the legs first, then swing the back, then pull the arms — in that order.","Finish with the handle at the bottom of the on, each leg."]},"armcircle":{"name":"Arm circles","steps":["Stand tall, arms out to the sides.","Small circles first, building to full range overhead and back.","Reverse direction halfway through."]},"wgs":{"name":"World's greatest stretch","steps":["Step into a deep lunge and put both hands on the floor inside the front foot.","Drop the back hip toward the floor, then reach the inside hand up and rotate the chest open.","Follow your hand with your eyes. Both sides, slowly."]}};

/* Pick the most natural installed voice rather than the robotic default,
   then slow it slightly and let punctuation do the phrasing. */
const VOICE={v:null};
function pickVoice(){
 if(!("speechSynthesis"in window))return;
 const vs=speechSynthesis.getVoices()||[];if(!vs.length)return;
 const en=vs.filter(v=>/^en/i.test(v.lang));
 const pool=en.length?en:vs;
 /* network/neural voices sound markedly more human than the built-in ones */
 const net=pool.filter(v=>v.localService===false);
 const pref=[/premium/i,/enhanced/i,/neural/i,/natural/i,/siri/i,
             /\bava\b/i,/\bzoe\b/i,/\bnoah\b/i,/samantha/i,/karen/i,/serena/i,/matilda/i,
             /moira/i,/tessa/i,/daniel/i,/google (uk|us) english/i];
 for(const p of pref){const m=net.find(v=>p.test(v.name));if(m){VOICE.v=m;return}}
 if(net.length){VOICE.v=net[0];return}
 for(const p of pref){const m=pool.find(v=>p.test(v.name));if(m){VOICE.v=m;return}}
 VOICE.v=pool.find(v=>/^en-AU/i.test(v.lang))||pool.find(v=>/^en-GB/i.test(v.lang))||pool[0];
}

function say(t){if(!AU.voice||!("speechSynthesis"in window)||!t)return;
 try{
  /* only interrupt if something is still mid-sentence, and give short cues a
     beat to land — cutting words off is what makes it sound synthetic */
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  if(VOICE.v){u.voice=VOICE.v;if(VOICE.v.lang)u.lang=VOICE.v.lang}
  u.rate=.92;u.pitch=1.0;u.volume=1;

 }catch(e){}}

/* One beep per second over the last seven seconds of ANY timed interval —
   warm-up round, engine interval, rest, stretch hold. Fired from the running

function cdBeep(sec){
 if(!AU.on)return;
 if(sec===1)tone(1245,.20,0,1.05);
 else tone(880,.11,0,.8);
 bz(sec===1?[70]:[35]);
}

const cEnd=()=>{tone(784,.18,0,1);tone(1046,.18,.18,1);tone(1568,.55,.36,1.15);bz([120,80,120,80,240])};

const FRAMED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
/* Inside a viewer frame the host intercepts external links and only a new
   context works, so we use _blank there. Run the file on its own — saved to
   your home screen — and we navigate the same tab instead: the YouTube app
   takes over as a universal link and there is no leftover tab at all. */
function goVideo(name){
 const url=yt(name);
 try{
  const a=document.createElement("a");
  a.href=url; a.target=FRAMED?"_blank":"_self";
  if(FRAMED)a.rel="noopener";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{try{a.remove()}catch(e){}},0);
 }catch(e){ try{window.open(url,FRAMED?"_blank":"_self")}catch(e2){} }
}

async function awake(){try{if("wakeLock"in navigator)S.wake=await navigator.wakeLock.request("screen")}catch(e){}}
const unawake=()=>{try{S.wake&&S.wake.release();S.wake=null}catch(e){}};
function begin(i){aInit();if(AU.gain)AU.gain.gain.value=AU.vol;
 pFigs.forEach(f=>f.stop());pFigs=[];
 S.d=DAYS[i];S.bi=0;S.tIdx=0;S.qi=0;S.set=1;S.rest=false;S.ip="work";S.round=1;
 S.q=S.d.work.map((_,k)=>k);S.log=[];S.swapped={};S.t0=Date.now();S.paused=0;S.pausedAt=0;S.reps=0;
 S.left=S.d.ign.work;S.secs=blockSecs(S.d,S.week);S.units=unitCounts(S.d,S.week);
 document.getElementById("run").classList.add("on");awake();
 startCountdown(()=>{paint();cGo();say(pick(LEAD_GO,0)+". "+curName()+".")});
 runClock();}

function resume(r){aInit();if(AU.gain)AU.gain.gain.value=AU.vol;
 pFigs.forEach(f=>f.stop());pFigs=[];
 S.d=DAYS[r.day];S.week=r.week;S.bi=r.bi;S.qi=r.qi;S.q=r.q;S.set=r.set;S.rest=r.rest;S.left=r.left;
 S.tIdx=r.tIdx;S.round=r.round;S.ip=r.ip;S.swapped=r.swapped||{};S.log=r.log||[];S.t0=r.t0;S.paused=r.paused||0;
 S.weight=r.weight||20;S.reps=r.reps||0;S.spoke=null;S.pausedAt=0;S.secs=blockSecs(S.d,S.week);S.units=unitCounts(S.d,S.week);
 Object.keys(S.swapped).forEach(k=>{const e=S.d.work.concat(S.d.core).find(x=>x.n===k);
  if(e){const s=e.swaps.find(y=>y.n===S.swapped[k]);if(s)EX_PAT[s.n]=s.pat}});
 document.getElementById("run").classList.add("on");awake();paint();runClock();pauseSession();}

function runClock(){clearInterval(S.tick);let last=Date.now();
 S.tick=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;
  if(S.pausedAt)return;
  const b=blk();
  const e=(b==="work"||b==="core")?curE():null;
  const timed=(b!=="work"&&b!=="core")||S.rest||S.trans||(e&&e.timed);
  if(!timed)return;
  S.left-=dt;const sec=Math.ceil(S.left);
  if(sec<=CD_FROM&&sec>=1&&sec!==S.spoke){S.spoke=sec;
   cdBeep(sec);
   if(AU.voice&&sec<=5)say(String(sec));
   const st=document.getElementById("stage");st.classList.add("pulse");setTimeout(()=>st.classList.remove("pulse"),470);}
  if(S.left<=0){done();return}
  clock();},100);}

function startCountdown(then){const o=document.getElementById("cd"),n=document.getElementById("cdn");
 let k=3;o.classList.add("on");n.textContent=k;say("Three,");tone(880,.18,0,1);
 const iv=setInterval(()=>{k--;
  if(k>0){n.textContent=k;say(k===2?"Two,":"One,");tone(880,.18,0,1)}
  else{clearInterval(iv);o.classList.remove("on");then&&then()}},1000);}

function done(){if(!S.d)return;const b=blk(),d=S.d;
 if(b==="ign"){
  if(S.ip==="work"){
   if(S.tIdx+1>=d.ign.rounds){nextBlock();return}   // that was the last round
   if(d.ign.rest>0){                                 // only pause if the day has a gap
    S.ip="rest";S.left=d.ign.rest;S.spoke=null;cRest();
    say("Rest. Next up, "+ignName(1)+".");
   }else{                                            // continuous: straight into the next move
    S.tIdx++;S.ip="work";S.left=d.ign.work;S.spoke=null;cGo();say("Straight into "+ignName(0)+".");
   }
  }else{
   S.tIdx++;S.ip="work";S.left=d.ign.work;S.spoke=null;cGo();say(ignName(0)+".");
  }
  paint();return}
 if(b==="work"||b==="core"){
  if(S.trans){S.trans=false;advanceEx(true);return}
  const e=curE();
  if(e&&e.timed&&!S.rest){                       // a timed hold just finished
   if(e.side&&S.side===0){S.side=1;S.left=repsFor(e,S.week);S.spoke=null;
    cGo();say("Other side.");paint();return}
   S.side=0;setDone();return;
  }
  S.rest=false;S.spoke=null;S.side=0;
  if(e&&e.timed)S.left=repsFor(e,S.week);
  cGo();say(pick(LEAD_GO,S.set)+", set "+wnum(S.set)+" of "+wnum(setsFor(e,S.week,d))+
   (e&&e.side?", "+(S.side?"other side":"first side"):"")+".");
  paint();return}
 if(b==="eng"){
  if(S.ip==="work"){if(S.round>=engRounds(d)){nextBlock();return}
   S.ip="rest";S.left=d.eng.rest;S.spoke=null;cRest();say("Rest.");paint();return}
  S.round++;S.ip="work";S.left=d.eng.work;S.spoke=null;cGo();say("Round "+wnum(S.round)+" of "+wnum(engRounds(d))+".");paint();return}
 if(b==="stretch"){S.tIdx++;
  if(S.tIdx>=d.stretch.length){finish();return}
  S.left=d.stretch[S.tIdx][1];S.spoke=null;cGo();say(curName());paint();return}}

function prevBlock(){
 if(!S.d||S.bi<=0)return false;
 S.bi--;S.spoke=null;S.rest=false;S.ip="work";
 const b=blk(),d=S.d;
 if(b==="ign"){S.tIdx=Math.max(0,d.ign.rounds-1);S.left=d.ign.work}
 else if(b==="work"){S.q=d.work.map((_,i)=>i);S.qi=S.q.length-1;S.set=1}
 else if(b==="eng"){S.round=d.eng.rounds;S.left=d.eng.work}
 else if(b==="core"){S.qi=d.core.length-1;S.set=1}
 else if(b==="stretch"){S.tIdx=d.stretch.length-1;S.left=d.stretch[S.tIdx][1]}
 cTick();paint();return true;}

function goBack(){if(!S.d)return false;
 if(S.trans){S.trans=false;paint();return true}
 const b=blk(),d=S.d;
 if(b==="ign"){
  if(S.ip==="rest"&&d.ign.rest>0){S.ip="work";S.left=d.ign.work}
  else if(S.tIdx>0){S.tIdx--;S.ip="work";S.left=d.ign.work}
  else return prevBlock();
  S.spoke=null;cTick();paint();return true}
 if(b==="eng"){
  if(S.ip==="rest"){S.ip="work";S.left=d.eng.work}
  else if(S.round>1){S.round--;S.left=d.eng.work}
  else return prevBlock();
  S.spoke=null;cTick();paint();return true}
 if(b==="stretch"){
  if(S.tIdx>0){S.tIdx--;S.left=d.stretch[S.tIdx][1];S.spoke=null;cTick();paint();return true}
  return prevBlock()}
 if(b==="core"){
  if(S.rest){S.rest=false;S.spoke=null;paint();return true}
  if(S.set>1){S.set--;S.spoke=null;paint();return true}
  if(S.qi>0){S.qi--;S.set=d.core[S.qi].sets;S.spoke=null;cTick();paint();return true}
  return prevBlock()}
 // strength
 if(S.rest){S.rest=false;S.spoke=null;paint();return true}
 if(S.set>1){S.set--;S.spoke=null;paint();return true}
 const finished=d.work.map((_,i)=>i).filter(i=>S.q.indexOf(i)===-1);
 if(finished.length){                       // step back into the exercise you just finished
  const last=finished[finished.length-1];
  S.q.splice(S.qi,0,last);
  S.set=setsFor(d.work[last],S.week,d);
  S.spoke=null;cTick();paint();return true}
 return prevBlock();}

function nextBlock(){if(!S.d)return;saveRun(true);S.bi++;S.spoke=null;S.tIdx=0;S.qi=0;S.set=1;S.rest=false;S.ip="work";S.round=1;
 const b=blk(),d=S.d;
 if(b==="work"){cGo();say("Right, strength. First up, "+curName()+", "+wnum(setsFor(curE(),S.week,d))+" sets of "+wnum(repsFor(curE(),S.week))+".");paint();return}
 if(b==="eng"){S.left=d.eng.work;cGo();say("Engine. "+d.eng.n+", let's work.");paint();return}
 if(b==="core"){const c0=curE();if(c0&&c0.timed)S.left=repsFor(c0,S.week);cGo();say("Core now. "+curName()+".");paint();return}
 if(b==="stretch"){S.left=d.stretch[0][1];cGo();say("Last one, stretching. "+curName()+".");paint();return}
 finish();}

function setDone(){if(!S.d)return;const _f=()=>saveRun(true);const b=blk(),e=curE(),d=S.d;
 const nm=S.swapped[e.n]||e.n;
 const n=b==="work"?setsFor(e,S.week,d):e.sets;
 if(b==="work"){S.log.push({ex:nm,set:S.set});
  const rec=STORE.get(S.week,d.key,e.n)||{sets:[]};
  rec.sets=rec.sets.filter(x=>x.set!==S.set);
  rec.sets.push({set:S.set,as:nm});
  rec.sets.sort((a,b)=>a.set-b.set);
  STORE.put(S.week,d.key,e.n,rec);}
 const rst=b==="work"?restFor(e,S.week):e.rest;
 if(S.set>=n){_f();advanceEx();return}
 S.set++;S.rest=true;S.left=rst;S.spoke=null;S.side=0;
_f();
 cRest();say(pick(LEAD_REST,S.set)+". Rest "+wnum(rst)+" seconds, then set "+wnum(S.set)+".");paint();}

function advanceEx(go){if(!S.d)return;saveRun(true);
 const bl=blk();
 if(!go&&!S.trans&&(bl==="work"||bl==="core")){
  const more=(bl==="work")?S.q.length>1:S.qi<S.d.core.length-1;
  if(more){S.trans=true;S.rest=false;S.left=TRANS;S.spoke=null;
   cRest();say("Nice work. Thirty seconds to set up the next one.");paint();return;}
 }
 S.trans=false;const b=blk();
 if(b==="work"){S.q.splice(S.qi,1);if(S.qi>=S.q.length)S.qi=0;
  if(!S.q.length){nextBlock();return}
  S.set=1;S.rest=false;S.spoke=null;S.side=0;const e=curE();
  if(e&&e.timed)S.left=repsFor(e,S.week);
  cGo();say("Next up, "+curName()+". "+wnum(setsFor(e,S.week,S.d))+" sets of "+wnum(repsFor(e,S.week))+".");paint();return}
 S.qi++;if(S.qi>=S.d.core.length){nextBlock();return}
 S.set=1;S.rest=false;S.spoke=null;S.side=0;
 const ce=curE();if(ce&&ce.timed)S.left=repsFor(ce,S.week);
 cGo();say("Next up, "+curName()+".");paint();}

function defer(){if(!S.d)return;if(blk()!=="work"||S.q.length<=1){say("Nothing else to move to");return}
 const id=S.q.splice(S.qi,1)[0];S.q.push(id);if(S.qi>=S.q.length)S.qi=0;
 S.set=1;S.rest=false;S.spoke=null;cTick();say("No problem, moved to the end. Next up, "+curName()+".");paint();}

/* ---------- paint ---------- */
let _lastPct=-1;
function clock(){if(!S.d||S.bi>=BL.length)return;
 const c=document.getElementById("rc"),b=blk();
 const sec=Math.ceil(S.left);
 if(sec!==_lastPct){_lastPct=sec;paintProgress();}
 const e=(b==="work"||b==="core")?curE():null;
 const timed=(b!=="work"&&b!=="core")||S.rest||S.trans||(e&&e.timed);
 c.textContent=timed?mmss(Math.max(0,Math.ceil(S.left))):"";
 c.style.color=S.rest||S.ip==="rest"?"var(--p20)":b==="stretch"?"var(--p15)":"var(--p10)";}
/* Progress counts things you actually finish: every warm-up round, every set,
   every engine round, every core set and every stretch hold. One unit done,
   one step forward — right through to the end of the stretch block.
   Timed blocks also fill smoothly inside the current round; sets step on
   completion, because that is the moment the work is banked. */
function unitCounts(d,wi){
 let w=0; d.work.forEach(e=>w+=setsFor(e,wi,d));
 let c=0; d.core.forEach(e=>c+=e.sets);
 return [d.ign.rounds,w,engRounds(d),c,d.stretch.length];
}
function blockSecs(d,wi){
 const ig=d.ign.rounds*(d.ign.work+d.ign.rest);
 let w=0; d.work.forEach(e=>{const n=setsFor(e,wi,d);
  let ww=e.role==="hold"?e.reps:Math.max(24,repsFor(e,wi)*3.2); if(e.side)ww*=2;
  w+=22+n*ww+(n-1)*restFor(e,wi);});
 const en=engRounds(d)*(d.eng.work+d.eng.rest);
 let co=0; d.core.forEach(e=>{let ww=e.role==="hold"?e.reps:Math.max(20,e.reps*2.6); if(e.side)ww*=2;
  co+=15+e.sets*ww+(e.sets-1)*e.rest;});
 return [ig,w+TRANS*(d.work.length-1),en,co+TRANS*(d.core.length-1),d.stretch.reduce((a,x)=>a+x[1],0)];
}
const clamp=(v,lo,hi)=>v<lo?lo:v>hi?hi:v;
/* units finished inside block i (may be fractional for the timed blocks) */
function blockDone(i){
 if(!S.d)return 0;
 const d=S.d,u=S.units||unitCounts(d,S.week);
 if(i<S.bi)return u[i];
 if(i>S.bi)return 0;
 if(i===0){const len=d.ign.work+d.ign.rest;
  const inUnit=S.ip==="work"?(d.ign.work-S.left):(d.ign.work+(d.ign.rest-S.left));
  return clamp(S.tIdx+inUnit/len,0,u[0]);}
 if(i===1){let done=0;
  d.work.forEach((e,k)=>{if(S.q.indexOf(k)===-1)done+=setsFor(e,S.week,d)});
  // during a changeover the current exercise is finished but not yet dequeued
  if(S.q.length)done+=S.trans?setsFor(curE(),S.week,d):(S.set-1);
  return clamp(done,0,u[1]);}
 if(i===2){const len=d.eng.work+d.eng.rest;
  const inUnit=S.ip==="work"?(d.eng.work-S.left):(d.eng.work+(d.eng.rest-S.left));
  return clamp((S.round-1)+inUnit/len,0,u[2]);}
 if(i===3){let done=0;
  for(let k=0;k<S.qi&&k<d.core.length;k++)done+=d.core[k].sets;
  done+=S.trans?(d.core[S.qi]?d.core[S.qi].sets:0):(S.set-1);
  return clamp(done,0,u[3]);}
 const cur=d.stretch[S.tIdx];
 return clamp(S.tIdx+(cur?(cur[1]-S.left)/cur[1]:0),0,u[4]);
}
const blockFrac=i=>{const u=(S.units||unitCounts(S.d,S.week))[i];return u?clamp(blockDone(i)/u,0,1):0};
function progress(){
 if(!S.d)return{frac:0,left:0,done:0,total:0};
 const u=S.units||unitCounts(S.d,S.week);
 const secs=S.secs||blockSecs(S.d,S.week);
 /* Walk the blocks once: count units finished, and the seconds those units
    were budgeted. Time left comes from the work STILL TO DO — never from a
    projected total minus elapsed, which is what made it stick near an hour. */
 let done=0,total=0,doneSec=0,totalSec=0;
 for(let i=0;i<5;i++){
  total+=u[i]; totalSec+=secs[i];
  const d=blockDone(i);
  done+=d;
  doneSec+=u[i]?secs[i]*(d/u[i]):0;
 }
 const frac=total?clamp(done/total,0,1):0;
 const elapsed=Math.max(0,(Date.now()-S.t0-S.paused-(S.pausedAt?Date.now()-S.pausedAt:0))/1000);
 /* scale the remainder by how your real pace compares with the budget */
 let pace=1;
 if(doneSec>120&&elapsed>90)pace=clamp(elapsed/doneSec,0.5,2.5);
 const left=Math.max(0,Math.round((totalSec-doneSec)*pace/60));
 return{frac,left,done:Math.floor(done),total};
}
function paintProgress(){
 const g=id=>document.getElementById(id);
 const p=progress(),pct=Math.round(p.frac*100);
 const f=g("ovf");if(f)f.style.width=pct+"%";
 const t=g("ovp");if(t)t.textContent=pct+"%";
 const l=g("ovl");if(l)l.textContent=p.done+"/"+p.total+" done · "+p.left+" min left";
 document.querySelectorAll("#rb .bl").forEach((el,i)=>{
  const b=el.querySelector("b"); if(b)b.style.width=Math.round(blockFrac(i)*100)+"%";});
}
function paintBlocks(){document.getElementById("rb").innerHTML=BL.map(([k,l],i)=>
 `<div class="bl ${i<S.bi?"on":i===S.bi?"cur":""}"><i><b></b></i><span>${l}</span></div>`).join("");
 paintProgress();}
function setFig(){if(!S.d)return;
 if(S.trans){const b=blk(),d=S.d;
  const nx=(b==="work")?d.work[S.q[(S.qi+1)%S.q.length]]:d.core[Math.min(S.qi+1,d.core.length-1)];
  const kk=nx?patFor(S.swapped[nx.n]||nx.n):null, sv=document.getElementById("demo");
  if(S.fig)S.fig.stop();
  S.fig=kk?mkAnim(sv,kk,{scale:.66,ox:110,oy:134}):(sv.innerHTML="",{stop(){}});
  return;}
 const k=curPat(),sv=document.getElementById("demo");
 if(S.fig)S.fig.stop();
 if(k)S.fig=mkAnim(sv,k,{scale:.66,ox:110,oy:134});else{sv.innerHTML="";S.fig={stop(){}}}}
function paint(){if(!S.d||S.bi>=BL.length)return;
 const g=id=>document.getElementById(id),b=blk(),d=S.d;
 saveRun();
 paintBlocks();g("rd").innerHTML="";g("rl").textContent="";g("rt").innerHTML="";
 const main=g("bm");main.className="prim";
 const wEl=g("rw");if(wEl)wEl.innerHTML="";
 g("bs").style.opacity=(b==="work"||b==="core"||b==="eng")?1:.35;
 if(b==="ign"){g("rh").textContent=`Ignite · round ${Math.min(S.tIdx+1,d.ign.rounds)} of ${d.ign.rounds}`;
  g("rs").textContent=(S.ip==="work"||!d.ign.rest)?"Warm-up":"Warm-up · rest";
  g("rs").style.color=S.ip==="work"?"var(--p25)":"var(--muted)";
  g("rn").textContent=curName();
  g("rq").textContent=(S.ip==="rest"&&d.ign.rest>0)?("Coming up: "+ignName(1)+".")
   :((d.ign.cues&&d.ign.cues[curName()])||"Hard bodyweight cardio — be sweating by the end.");
  main.textContent="Skip ahead";main.className="prim dim";}
 else if(b==="eng"){g("rh").textContent=`Engine · round ${Math.min(S.round,engRounds(d))} of ${engRounds(d)}`;
  g("rs").textContent=S.ip==="work"?"Engine":"Engine · rest";
  g("rs").style.color=S.ip==="work"?"var(--p10)":"var(--muted)";
  g("rn").textContent=curName();g("rq").textContent=d.eng.cue;
  main.textContent="Skip ahead";main.className="prim dim";}
 else if(b==="stretch"){g("rh").textContent=`Stretch · ${S.tIdx+1} of ${d.stretch.length}`;
  g("rs").textContent="Stretch";g("rs").style.color="var(--p15)";
  g("rn").textContent=curName();g("rq").textContent=d.stretch[S.tIdx][2];
  main.textContent="Skip ahead";main.className="prim dim";}
 else{const e=curE(),n=b==="work"?setsFor(e,S.week,d):e.sets,r=b==="work"?repsFor(e,S.week):e.reps;
  const nm=S.swapped[e.n]||e.n;
  g("rh").textContent=b==="work"
   ?`Strength · exercise ${d.work.length-S.q.length+1} of ${d.work.length}`
   :`Core · ${S.qi+1} of ${d.core.length}`;
  g("rs").textContent=S.trans?"Next station":(S.rest?(b==="core"?"Core · rest":"Rest"):(b==="core"?"Core":"Work"));
  g("rs").style.color=S.rest?"var(--p20)":`var(${d.color})`;
  if(S.trans){
   const nx=(b==="work")?d.work[S.q[(S.qi+1)%S.q.length]]:d.core[Math.min(S.qi+1,d.core.length-1)];
   g("rn").textContent=nx?nx.n:nm;
   g("rq").textContent="Walk over and set up. Starting in "+Math.max(0,Math.ceil(S.left))+" seconds.";
  } else g("rn").textContent=nm;
  g("rt").innerHTML=e.timed?`Set ${S.set} of ${n} · <b>${r}s${e.side?(S.side?" · second side":" · first side"):""}</b>`
   :`Set ${S.set} of ${n} · <b>${r} reps${e.side?(S.side?" · second side":" · first side"):""}</b>`;
  let dt="";for(let k=1;k<=n;k++)dt+=`<div class="sd ${k<S.set?"on":k===S.set?"cur":""}"></div>`;
  g("rd").innerHTML=dt;

  g("rq").textContent=S.rest?`Next: set ${S.set} of ${n}`:e.cue;
  main.textContent=S.trans?"I'm ready":(S.rest?"Skip rest":(e.timed?"Skip ahead":"Set done"));
  main.className=(S.rest||S.trans)?"prim rest":"prim";}
 const wk=curPat();
 if(wEl&&wk&&WHY[wk])wEl.innerHTML="<b>Why this one</b>"+WHY[wk];
 setFig();clock();}

/* ---------- finish ---------- */
function finish(){clearInterval(S.tick);unawake();clearRun();cEnd();say("And that's the session. Well done, that's another one banked.");
 if(S.fig)S.fig.stop();
 const d=S.d,el=document.getElementById("app");
 document.getElementById("run").classList.remove("on");
 const by={};S.log.forEach(l=>{(by[l.ex]=by[l.ex]||[]).push(l)});
 const mins=Math.round((Date.now()-S.t0-S.paused)/60000);
 el.innerHTML=`<div class="end"><div class="eyebrow">Week ${S.week+1} · ${d.day} · ${mins} min</div>
  <h2>${d.title} done.</h2>
  <p>All logged. Same session next week — a little sharper.</p>
  <div class="lt">${Object.keys(by).length?Object.keys(by).map(k=>
   `<div class="lr"><b>${k}</b><span>${by[k].length} sets</span></div>`).join("")
   :`<div class="lr"><b>No sets logged</b><span>—</span></div>`}</div>
  <button class="start" id="cp">Copy the log</button><button class="btnwide" id="hm">Back to the week</button></div>`;
 S.d=null;S.fig=null;
 el.querySelector("#hm").onclick=()=>{home();window.scrollTo(0,0)};
 el.querySelector("#cp").onclick=()=>{const t=`${d.title} — week ${S.week+1}\n`+Object.keys(by).map(k=>
   `${k}: ${by[k].length} sets`).join("\n");
  try{navigator.clipboard.writeText(t);el.querySelector("#cp").textContent="Copied"}
  catch(e){el.querySelector("#cp").textContent="Copy failed — screenshot it"}};}

/* ---------- controls ---------- */
document.getElementById("bm").onclick=()=>{aInit();const b=blk();
 if(S.trans){S.trans=false;advanceEx(true);return}
 if(b==="ign"||b==="eng"||b==="stretch"){S.left=-1;done();return}
 if(S.rest){S.rest=false;S.spoke=null;cGo();say("Go. Set "+S.set);paint();return}
 setDone();};
document.getElementById("bb").onclick=()=>{aInit();goBack()};
document.getElementById("bk").onclick=()=>{const b=blk();
 if(S.trans){S.trans=false;advanceEx(true);return}
 if(b==="work"||b==="core")advanceEx();else if(b==="stretch"){S.tIdx=S.d.stretch.length-1;S.left=-1;done()}
 else nextBlock();};
document.getElementById("bs").onclick=()=>{const b=blk(),d=S.d;
 if(b==="eng"){showEx(curName(),d.eng.cue,d.eng.swaps,s=>{S.swapped["__eng"]=s.n;
  EX_PAT[s.n]=s.pat;say("Switched to "+s.n+".");paint()});return}
 const e=curE();if(!e)return;
 showEx(S.swapped[e.n]||e.n,e.cue,e.swaps,s=>{S.swapped[e.n]=s.n;EX_PAT[s.n]=s.pat;
  say("Switched to "+s.n+".");paint()});};
document.getElementById("bv").onclick=openVideo;
function pauseSession(){S.pausedAt=Date.now();
 document.getElementById("pzt").textContent=mmss(Math.round((Date.now()-S.t0-S.paused)/1000))+" elapsed";
 document.getElementById("pzn").textContent=curName();
 document.getElementById("pz").classList.add("on");saveRun(true);
 try{speechSynthesis.cancel()}catch(e){}}
document.getElementById("bp").onclick=pauseSession;
document.getElementById("pzr").onclick=()=>{S.paused+=Date.now()-S.pausedAt;S.pausedAt=0;
 document.getElementById("pz").classList.remove("on");aInit();
 const b=blk(),timed=(b!=="work"&&b!=="core")||S.rest;
 if(timed)S.spoke=null;};   // the clock re-arms the countdown itself
document.getElementById("pzv").onclick=openVideo;
document.getElementById("pze").onclick=()=>{document.getElementById("pz").classList.remove("on");
 S.pausedAt=0;clearRun();finish()};
document.getElementById("bq").onclick=()=>{clearInterval(S.tick);unawake();S.pausedAt=0;S.d=null;if(S.fig)S.fig.stop();
 try{speechSynthesis.cancel()}catch(e){}
 document.getElementById("run").classList.remove("on");home();window.scrollTo(0,0)};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.d){awake();aInit()}});
home();
</script>
</body>
</html>
