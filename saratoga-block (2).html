<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saratoga Block — 8 Weeks</title>
<style>
:root{--bg:#12141A;--surface:#1B1E26;--s2:#242832;--line:#2E3340;--text:#E9EAEE;--muted:#8B90A0;
--p25:#D93B3B;--p20:#2E7BC4;--p15:#E0AC26;--p10:#2FA35C;--eq:#6E92C4;
--mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:radial-gradient(120% 60% at 50% -10%,rgba(224,172,38,.07),transparent 60%),
            radial-gradient(90% 50% at 0% 100%,rgba(46,123,196,.06),transparent 60%)}
body{min-height:100dvh;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--p15);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 44px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
header.mast{padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.mast h1{font-size:27px;line-height:1.06;margin:8px 0 7px;font-weight:800;letter-spacing:-.035em;
 background:linear-gradient(180deg,#fff,#B9BECC);-webkit-background-clip:text;background-clip:text;
 -webkit-text-fill-color:transparent}
.mast p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.weeks{display:flex;gap:6px;margin:16px 0 8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:44px;padding:10px 6px;border-radius:9px;background:var(--surface);text-align:center;
font-family:var(--mono);font-size:15px;color:var(--muted);border:1px solid transparent}
.wk b{display:block;font-size:9px;letter-spacing:.12em;margin-top:2px;opacity:.75}
.wk.sel{background:linear-gradient(180deg,#2C313D,#242832);color:var(--text);border-color:var(--p15);
 box-shadow:0 0 0 1px rgba(224,172,38,.25),0 4px 14px rgba(0,0,0,.35)}
.note{font-size:12.5px;color:var(--muted);margin:2px 0 18px;line-height:1.5}.note b{color:var(--text)}
.day{width:100%;text-align:left;background:linear-gradient(180deg,#1D212A,#181B23);border-radius:15px;
 padding:15px 16px;margin-bottom:10px;border:1px solid var(--line);display:block;position:relative;overflow:hidden;
 box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.28);transition:transform .12s ease}
.day::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,transparent);opacity:.85}
.day:active{transform:scale(.988)}
.day:active{background:var(--s2)}
.day .top{display:flex;align-items:center;gap:9px}
.day .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:4px;color:#0E1014;font-weight:700}
.day .ok{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--p10)}
.day h3{font-size:17.5px;margin:9px 0 5px;font-weight:700;letter-spacing:-.015em}
.day p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;
 border-radius:99px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);color:var(--muted)}
.meta{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:14px 0}
.panel h4{margin:0 0 3px;font-size:14px}.panel .sub{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.optrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.optrow:first-of-type{border-top:0}.optrow .lbl{flex:1;font-size:13.5px}
.optrow .lbl span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.sw{flex:0 0 48px;height:28px;border-radius:14px;background:var(--s2);border:1px solid var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.sw[aria-pressed="true"]{background:rgba(224,172,38,.22);border-color:var(--p15)}
.sw[aria-pressed="true"]::after{transform:translateX(20px);background:var(--p15)}
input[type=range]{width:100%;accent-color:var(--p15);margin:8px 0 2px}
.btnwide{width:100%;padding:12px;border-radius:9px;background:var(--s2);border:1px solid var(--line);
font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text);margin-top:8px}
.snd{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:10px;color:var(--muted)}
.snd b{color:var(--p10)}.snd.warn b{color:var(--p15)}
.back{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 0}
.sec{margin:20px 0}
.sech{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sech .dot{width:11px;height:11px;border-radius:2px}
.sech h4{margin:0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.sech .fmt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.secsub{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.45}
.ex{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.ex .th{flex:0 0 58px;height:58px;background:var(--bg);border-radius:8px;border:1px solid var(--line);overflow:hidden}
.ex .b{flex:1;min-width:0}
.ex .b strong{font-size:15px;font-weight:600;display:block}
.ex .b .pre{font-family:var(--mono);font-size:12px;color:var(--p15);margin-top:3px}
.ex .b .cue{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.ex .b .sw2{font-size:11.5px;color:var(--eq);margin-top:4px;line-height:1.4}
.ex .r{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:3px;text-align:right}
.start{position:sticky;bottom:14px;width:100%;padding:17px;border-radius:14px;background:linear-gradient(180deg,#E2483F,#C22F2F);color:#fff;
font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono);margin-top:24px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.modal{position:fixed;inset:0;background:rgba(8,9,12,.76);display:none;z-index:60;align-items:flex-end}
.modal.on{display:flex}
.mc{background:var(--surface);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;border-top:1px solid var(--line);
padding:16px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.mc .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.mc h3{margin:0 0 4px;font-size:20px}
.mc .kind{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.demo{background:var(--bg);border:1px solid var(--line);border-radius:12px;height:200px;margin:13px 0;display:block;width:100%}
.steps{list-style:none;padding:0;margin:4px 0 0;counter-reset:s}
.steps li{position:relative;padding:9px 0 9px 30px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;font-family:var(--mono);font-size:11px;color:var(--p15)}
.cuebox{font-size:13px;color:var(--muted);line-height:1.55;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.yt{display:block;text-align:center;margin-top:13px;padding:13px;border-radius:9px;background:#7A1414;color:#fff;
text-decoration:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}
.swopt{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.swopt .th{flex:0 0 54px;height:54px;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.swopt b{flex:1;font-size:15px;font-weight:600}
.swopt .go{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--p15);text-transform:uppercase}
#run{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50}
#run.on{display:flex}
.rtop{padding:11px 16px 0}
.rtop .row{display:flex;align-items:center;gap:10px}
.rtop .row .eyebrow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quit{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding:6px 2px}
.blocks{display:flex;gap:5px;margin:10px 0 2px}
.bl{flex:1;text-align:center}
.bl i{display:block;height:5px;border-radius:3px;background:var(--s2)}
.bl span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bl.on i{background:var(--p10)}.bl.cur i{background:var(--p15)}.bl.cur span{color:var(--text)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 18px;text-align:center;min-height:0;overflow:hidden}
.state{font-family:var(--mono);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:700}
.exn{font-size:clamp(19px,5.8vw,27px);font-weight:750;line-height:1.12;letter-spacing:-.02em;margin:5px 0 0;max-width:18ch}
#demo{width:100%;max-width:280px;height:clamp(92px,18vh,144px)}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.05em;font-size:clamp(50px,16vw,90px);line-height:.92;margin:0}
.tgt{font-family:var(--mono);font-size:14.5px;margin-top:3px}.tgt b{color:var(--p15)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.sd{width:9px;height:9px;border-radius:50%;background:var(--s2);border:1px solid var(--line)}
.sd.on{background:var(--p10);border-color:var(--p10)}.sd.cur{background:var(--p15);border-color:var(--p15)}
.small{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px}
.cue{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.45;max-width:32ch}
.logger{display:flex;gap:8px;margin-top:10px;width:100%;max-width:330px}
.field{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px 8px}
.field .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field .r2{display:flex;align-items:center;gap:4px;margin-top:2px}
.field button{flex:0 0 30px;height:30px;border-radius:8px;background:var(--s2);font-size:17px;font-weight:600}
.field .val{flex:1;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;text-align:center}
.stage.pulse .clock{animation:beat .5s ease-in-out}
@keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.stage.pulse .clock{animation:none}}
.ctrls{padding:8px 16px calc(13px + env(safe-area-inset-bottom))}
.prim{width:100%;padding:18px;border-radius:14px;background:linear-gradient(180deg,#37B368,#279253);color:#04140A;font-size:16px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:16px;
letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.prim.rest{background:linear-gradient(180deg,#3A8BD4,#2467A8);color:#fff}.prim.dim{background:var(--s2);color:var(--text)}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.sbtn{padding:13px 2px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);
font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sbtn:active{background:var(--s2)}
.sbtn.vid{color:#E58C8C;border-color:#4A2A2A}.sbtn.swp{color:var(--eq);border-color:#33415A}
#cd{position:fixed;inset:0;background:rgba(10,11,14,.96);display:none;z-index:70;align-items:center;justify-content:center;flex-direction:column}
#cd.on{display:flex}
#cd .n{font-family:var(--mono);font-size:clamp(110px,34vw,220px);font-weight:800;line-height:1;color:var(--p15)}
#cd .l{font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:10px}
#pz{position:fixed;inset:0;background:rgba(10,11,14,.97);display:none;z-index:65;align-items:center;justify-content:center;flex-direction:column;padding:24px}
#pz.on{display:flex}
#pz h2{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
#pz .t{font-family:var(--mono);font-size:15px;color:var(--muted);margin-bottom:26px}
#pz .b{width:100%;max-width:340px}
#pz .b button{width:100%;margin-bottom:9px}
.end{text-align:center;padding:32px 20px}
.end h2{font-size:27px;margin:12px 0 8px}
.end p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 auto;max-width:32ch}
.lt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin:20px 0;text-align:left}
.lt .lr{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.lt .lr:first-child{border-top:0}.lt .lr b{flex:1;font-weight:600}
.lt .lr span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hero{width:100%;text-align:left;display:block;position:relative;overflow:hidden;margin:2px 0 6px;
 padding:18px 18px 16px;border-radius:18px;border:1px solid rgba(224,172,38,.35);
 background:linear-gradient(150deg,rgba(224,172,38,.14),rgba(27,30,38,.9) 46%,#1B1E26);
 box-shadow:0 10px 34px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.05) inset;transition:transform .12s ease}
.hero:active{transform:scale(.99)}
.hero .lab{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--p15);font-weight:700}
.hero h2{margin:9px 0 5px;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.hero p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.hero .go{display:flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--mono);font-size:11.5px;
 letter-spacing:.16em;text-transform:uppercase;color:var(--text);font-weight:700}
.hero .go i{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--p15);color:#12141A;
 display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.divider span{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.divider i{flex:1;height:1px;background:var(--line)}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
footer b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="run">
  <div class="rtop"><div class="row"><div class="eyebrow" id="rh">—</div><button class="quit" id="bq">End</button></div>
    <div class="blocks" id="rb"></div></div>
  <div class="stage" id="stage">
    <div class="state" id="rs">—</div><div class="exn" id="rn">—</div>
    <svg id="demo" viewBox="0 0 220 150" aria-hidden="true"></svg>
    <div class="clock num" id="rc"></div><div class="tgt" id="rt"></div>
    <div class="dots" id="rd"></div><div class="small" id="rl"></div><div class="cue" id="rq"></div>
    <div class="logger" id="rlog" style="display:none">
      <div class="field"><div class="cap">Weight kg</div><div class="r2"><button id="wd">−</button><div class="val num" id="wv">0</div><button id="wu">+</button></div></div>
      <div class="field"><div class="cap">Reps done</div><div class="r2"><button id="rdn">−</button><div class="val num" id="rv">0</div><button id="ru">+</button></div></div>
    </div>
  </div>
  <div class="ctrls"><button class="prim" id="bm">Set done</button>
    <div class="srow"><button class="sbtn" id="bp">Pause</button><button class="sbtn swp" id="bs">Swap</button>
      <button class="sbtn vid" id="bv">Video</button><button class="sbtn" id="bk">Skip</button></div></div>
</div>
<div id="cd"><div class="n num" id="cdn">3</div><div class="l" id="cdl">Get ready</div></div>
<div id="pz"><h2>Paused</h2><div class="t num" id="pzt">0:00 elapsed</div><div class="t" id="pzn" style="color:var(--text);margin-top:-18px"></div>
  <div class="b"><button class="prim" id="pzr">Resume</button>
    <button class="btnwide" id="pzv">Watch this exercise on YouTube</button>
    <button class="btnwide" id="pze">End session</button></div></div>
<div class="modal" id="md"><div class="mc" id="mcc"></div></div>
<script>
"use strict";

d bring the knees toward your face.","Lower slowly. This is a hip curl, not a leg swing."]},"thoracic":{"name":"Thoracic opener","steps":["Lie back over the big ball with the feet planted and hips supported.","Let the arms fall overhead and the upper back drape over the ball.","Breathe out and let the chest open. Thirty to sixty seconds."]},"bench_db":{"name":"Dumbbell bench press","steps":["Bells at the outside of the chest, wrists stacked over the elbows.","Press up and slightly together without clashing them at the top.","Shoulder blades stay pinned back into the bench throughout."]},"row_db":{"name":"Chest-supported dumbbell row","steps":["Chest on the incline bench, arm hanging straight down.","Drive the elbow up and back past your ribs, squeeze for a beat.","Let it hang fully at the bottom. No twisting the torso."]},"suitcase":{"name":"Suitcase carry","steps":["One heavy dumbbell in one hand, the other hand free.","Stand dead upright — do not lean away from the load. That resistance is the point.","Walk with short controlled steps, then swap sides."]},"dip":{"name":"Assisted dip","steps":["Hands on the dip handles, arms locked, lean the chest slightly forward.","Lower until the upper arms are about parallel to the floor — no deeper if the shoulders complain.","Press back up to a full lockout. Reduce the assistance as the weeks go on."]},"calfpress":{"name":"Calf press","steps":["On the leg press with the legs almost straight and only the balls of the feet on the platform.","Let the platform push the ankles back into a full stretch — that stretch is the whole point.","Press through the toes as far as the ankle will go and pause a second. Safety catches engaged."]},"ohp_bar":{"name":"Barbell overhead press","steps":["Bar at the collarbone, elbows just in front, feet under the hips.","Squeeze the glutes and brace hard — the trunk is what stops you leaning back.","Press up and slightly back so it finishes over the middle of your head, then lower under control."]},"pallof":{"name":"Pallof press","steps":["Stand side-on to the cable at chest height, hands together at the sternum.","Press straight out in front and hold. The cable will try to twist you — refuse.","Bring it back in slowly. Both sides, and the resistance stays honest only if you don't rotate."]},"latlunge":{"name":"Lateral lunge","steps":["Feet wide, toes pointing forward, a dumbbell held at the chest.","Push the hips back and sideways over one leg, letting that knee bend while the other stays straight.","Feel the stretch through the inner thigh, then drive back to the middle."]},"latraise":{"name":"Lateral raise","steps":["A light dumbbell in each hand, elbows very slightly bent.","Lead with the elbows and raise out to the sides until the arms are level with the shoulders.","Lower slowly. If you have to swing to move it, the weight is too heavy."]},"calfraise":{"name":"Calf raise","steps":["Stand with the balls of your feet on the edge of the step, holding a dumbbell.","Let the heels sink below the step for a full stretch.","Drive up onto the toes as high as you can and pause a second at the top."]},"hipthrust":{"name":"Hip thrust","steps":["Upper back on the bench, feet planted, weight across the hips.","Drive through the heels and squeeze the glutes hard to lift the hips level with the torso.","Tuck the ribs down. The movement comes from the hips, not the low back."]},"farmercarry":{"name":"Farmer carry","steps":["A heavy dumbbell in each hand, arms straight, shoulders pulled back.","Walk tall with short controlled steps. Don't lean away from the weight.","Grip is the point. Set them down when your hands give out, not your legs."]},"curl_db":{"name":"Dumbbell curl","steps":["Stand tall, elbows pinned to the sides, palms facing forward.","Curl up under control and squeeze at the top.","Lower slowly all the way to straight. No swinging from the hips."]},"tricepsext":{"name":"Overhead triceps extension","steps":["Seated with the back supported, one dumbbell held overhead in both hands.","Lower it behind your head by bending only at the elbow. Upper arms stay vertical.","Press back up to straight and squeeze the triceps."]},"facepull":{"name":"Face pull","steps":["Cable set at face height, a rope or handles in each hand, arms extended.","Pull toward your face, leading with the elbows and finishing with the hands beside your ears.","Squeeze the rear shoulders for a beat. Light weight, high reps."]},"splitsquat":{"name":"Bulgarian split squat","steps":["Back foot resting on the box, front foot far enough forward to stay vertical.","Lower straight down until the back knee is close to the floor.","Drive up through the front heel. All the work stays in the front leg."]},"squat_bar":{"name":"Back squat","steps":["Bar across the traps, not the neck. Feet shoulder width, toes turned out slightly.","Brace your stomach, break at the hips and knees together, knees tracking out over the toes.","Go as deep as you can hold a flat back, then drive the floor away — hips and chest rise together."]},"squat_smith":{"name":"Smith machine squat","steps":["Feet slightly forward of the bar so your hips can travel back into the rails.","Same depth as a free squat. The machine holds the path, so all you control is depth and tempo.","Unlock the hooks before you start and re-lock at the top of the last rep."]},"squat_goblet":{"name":"Goblet squat","steps":["One bell held against the chest, elbows tucked inside the knees at the bottom.","Stay far more upright than a barbell squat — the load is in front, so the chest stays tall.","Sit straight down between the heels, pause, then stand."]},"squat_air":{"name":"Bodyweight squat","steps":["Arms reach forward as a counterweight as you descend.","Slow on the way down, pause at the bottom, drive the knees out.","Full depth every rep — this is a warm-up, so quality over speed."]},"rdl_bar":{"name":"Romanian deadlift","steps":["Soft knees, then push the hips straight back. This is a hinge, not a squat.","Bar stays touching your legs the whole way down, back flat.","Stop when the hamstrings run out of length, then squeeze the glutes to stand tall."]},"rdl_db":{"name":"Dumbbell RDL","steps":["A dumbbell in each hand, resting against the front of the thighs.","Push the hips back and let the bells slide down the legs. Flat back throughout.","Drive the hips forward to stand. Don't lean back at the top."]},"swing_kb":{"name":"Kettlebell swing","steps":["Hike the bell back between the legs like a rugby pass — forearms against the thighs.","Snap the hips forward hard. The bell floats to chest height; your arms don't lift it.","Let it fall, absorb it with the hips, straight into the next rep."]},"backext":{"name":"Back extension","steps":["Pads just below the hip bones, heels locked under the roller.","Hinge down until you feel the hamstrings, back staying flat.","Squeeze the glutes to come up and stop in a straight line — don't arch past it."]},"glutebridge":{"name":"Glute bridge","steps":["Shoulders on the mat, knees bent, heels close to your backside.","Drive through the heels and squeeze the glutes to lift the hips.","Hold for a second at the top. Ribs stay down — don't arch the low back."]},"lunge_db":{"name":"Reverse lunge","steps":["A dumbbell in each hand. Step back and lower the back knee toward the floor.","Front shin stays close to vertical, torso upright, weight through the front heel.","Drive back up through the front leg without pushing off the back foot."]},"stepup":{"name":"Step-up","steps":["Whole front foot on the step — the heel must not hang off.","Drive through the front heel and stand fully tall at the top.","Lower slowly under control. No hopping off the trailing leg."]},"legpress":{"name":"Seated leg press","steps":["Feet mid-platform, about shoulder width, back flat against the pad.","Lower until the knees are around ninety degrees. Stop before the low back rounds off the seat.","Press through the whole foot and stop just short of locking the knees."]},"legext":{"name":"Leg extension","steps":["Knees lined up with the machine's pivot, pad sitting on the ankles.","Extend until the legs are straight and pause a full second at the top.","Lower slowly — don't let the stack bang down."]},"legcurl":{"name":"Leg curl","steps":["Pad just above the heels, thighs pinned to the seat.","Curl the heels down and back as far as the machine allows, and squeeze the hamstrings.","Two seconds to return. The hips stay put the whole set."]},"bench_bar":{"name":"Bench press","steps":["Shoulder blades pinned back and down, feet flat, safeties set at chest height.","Lower to the bottom of the sternum, elbows about forty-five degrees from the body.","Touch, then press up and slightly back toward your face."]},"bench_smith":{"name":"Smith machine bench","steps":["Set the bench so the bar path lands on your lower chest.","Same setup as a free bench — shoulders back and down, feet planted.","The rails hold the path, so control the tempo instead. Two seconds down."]},"chestpress":{"name":"Chest press machine","steps":["Set the seat so the handles start level with the middle of your chest.","Press out and squeeze hard at full extension.","Come back until you feel the chest stretch, then go again."]},"pushup":{"name":"Push-up","steps":["Hands under the shoulders, body in one straight line from head to heels.","Lower until the chest is a fist off the floor, elbows tucked to about forty-five degrees.","Press the floor away. Drop to the knees before the form goes."]},"ohp_db":{"name":"Dumbbell shoulder press","steps":["Seated with the back supported, bells at shoulder height, elbows slightly forward.","Ribs pulled down — don't arch the low back to get the weight up.","Press up and slightly back so it finishes over the middle of your head."]},"ohp_mach":{"name":"Shoulder press machine","steps":["Seat height so the handles start at shoulder level.","Press up without shrugging into your ears.","Stop just short of lockout to keep tension on the shoulder."]},"pushpress":{"name":"Push press","steps":["Weight at the shoulders, elbows in front, feet directly under the hips.","Short dip from the legs, then drive up and punch the weight overhead.","Lock out with the weight over the middle of your head, then lower under control."]},"thruster":{"name":"Thruster","steps":["Front rack position, elbows up. Squat to full depth.","Drive out of the bottom and let that momentum carry into the press — one continuous movement.","Lock out overhead, return to the shoulders, straight into the next rep."]},"fly_cable":{"name":"Fly / reverse fly","steps":["Slight bend in the elbows and keep it fixed for the whole set.","Move in a wide arc — think about hugging a barrel.","Squeeze for a full second at the end range, then let it stretch back."]},"extrot":{"name":"External rotation","steps":["Cable at elbow height, elbow pinned to your ribs.","Rotate the forearm away from your body. Only the forearm moves.","Light weight. This is a warm-up for the shoulder, not a lift."]},"pullapart":{"name":"Band pull-apart","steps":["Arms straight out in front at chest height, light tension on the band.","Pull the band apart by squeezing the shoulder blades together.","Control the return. High reps, no ego."]},"curl_mach":{"name":"Biceps curl machine","steps":["Upper arms flat on the pad, chest against the support.","Curl up under control and squeeze at the top.","Lower slowly — the lowering is where most of the growth comes from."]},"pushdown":{"name":"Triceps pushdown","steps":["Elbows locked to your ribs, slight forward lean.","Push down until the arms are straight and hold for a beat.","Let it come back only as far as your elbows can stay still."]},"pulldown":{"name":"Lat pulldown","steps":["Thighs locked under the pad, chest up, slight backward lean.","Pull to the collarbone by driving the elbows down into your pockets.","Control the way up until the shoulders are fully stretched."]},"chinup":{"name":"Assisted chin-up","steps":["Hang with straight arms and the shoulders pulled down away from your ears.","Pull your chest toward the bar, not just your chin over it.","Lower all the way down. Reduce the assistance as the weeks go on."]},"row_cable":{"name":"Cable row","steps":["Chest tall, slight forward lean at the start, arms extended.","Pull to the belly button and squeeze the shoulder blades for a beat.","Return under control. Don't rock the torso to move the weight."]},"plank":{"name":"Plank","steps":["Elbows under the shoulders, forearms flat on the mat.","Squeeze the glutes and pull the ribs down so the hips don't sag.","Breathe normally. If the low back starts to ache, end the set."]},"sideplank":{"name":"Side plank","steps":["On one forearm, hips stacked, top arm reaching straight up.","Push the bottom hip up toward the ceiling and hold it there.","Match the time on both sides, even if the second side is harder."]},"hollow":{"name":"Hollow hold","steps":["Press the low back flat into the floor before you lift anything.","Lift the shoulders and legs, arms overhead if you can hold the position.","The moment the low back lifts off the floor, bend the knees or stop."]},"deadbug":{"name":"Dead bug","steps":["Low back flat, arms up, knees stacked over the hips.","Lower the opposite arm and leg slowly toward the floor.","Nothing moves in the low back. Return and swap sides."]},"rollout":{"name":"Swiss ball rollout","steps":["Kneel with the forearms on the ball, ribs pulled down.","Roll forward only as far as you can stop the hips sagging.","Pull back using your stomach, not your hip flexors."]},"crunch":{"name":"Swiss ball crunch","steps":["Low back supported on the ball, feet planted wide for balance.","Curl the ribs toward the hips. It's a short movement, not a sit-up.","Lower slowly and let the abs stretch back over the ball."]},"rowerg":{"name":"Rowing","steps":["Drive with the legs first, then swing the back, then pull the arms — in that order.","Finish with the handle at the bottom of the ribs, elbows past the body.","Reverse it exactly: arms away, then body, then let the knees bend."]},"ski":{"name":"SkiErg","steps":["Start tall with the handles above your head, arms nearly straight.","Drive down through the lats and hinge at the hips — the trunk does the work.","Finish with the hands past the hips, then stand back up tall."]},"airbike":{"name":"Air bike","steps":["Arms and legs push and pull together — that's where the power comes from.","Sit tall, don't collapse over the handles when it gets hard.","Pick a pace you can repeat every round, not just the first one."]},"bike_up":{"name":"Upright bike","steps":["Seat height so the knee is just short of straight at the bottom of the stroke.","Sit up, hands light on the bars.","Hold a steady cadence rather than mashing and coasting."]},"crosstrainer":{"name":"Cross-trainer","steps":["Whole foot on the pedal, upright posture.","Push and pull with the arms so it's a full body effort.","Keep the stride length consistent as you tire."]},"treadmill":{"name":"Treadmill","steps":["Set the incline first, then the speed.","Stay off the handrails — hold the belt speed with your legs.","To rest, straddle the belt rather than stopping the machine."]},"walk":{"name":"Easy walk","steps":["Flat and slow. This is recovery, not training.","Nose breathing if you can manage it.","Let the heart rate come down properly before you leave."]},"rope":{"name":"Battle rope","steps":["Half squat, chest up, weight in the middle of the feet.","Drive the waves from the hips and shoulders, not the wrists.","Keep the waves the same size for the whole interval — that's the test."]},"burpee":{"name":"Burpee","steps":["Squat down and plant the hands on the floor.","Jump or step the feet back and take the chest to the floor.","Come back up, feet under you, stand tall. Step instead of jumping to scale it."]},"breathing":{"name":"Box breathing","steps":["Sit down. Feet flat, hands resting on the thighs, spine tall.","In through the nose for four, hold for four, out for four, hold for four.","Keep the shoulders still — the breath should move your belly, not your chest."]},"foamroll":{"name":"Foam rolling","steps":["Put the roller under the muscle and take some weight through your hands.","Roll slowly, a few centimetres per second. Fast rolling does nothing.","When you find a spot that complains, stop there and breathe until it eases."]},"couchstr":{"name":"Couch stretch","steps":["Back foot up on the box or bench, back knee close to its base.","Tuck the pelvis under and squeeze the glute of the back leg — that's what makes it work.","Chest tall. Forty-five seconds each side."]},"hamstr":{"name":"Hamstring stretch","steps":["Heel on the bench, leg straight, toes pointing up.","Hinge forward from the hips with a flat back until the hamstring pulls.","Breathe out into it. Thirty seconds each side."]},"pecstr":{"name":"Pec stretch","steps":["Forearm flat against the rack upright, elbow at about shoulder height.","Rotate your chest away from the arm until you feel the stretch across the front.","Thirty seconds each side, no bouncing."]},"latstr":{"name":"Lat stretch","steps":["Take hold of the rack upright at about hip height and hinge back.","Push the hips away and let the shoulder open up.","Sink into it on each exhale. Thirty seconds each side."]},"calfstr":{"name":"Calf stretch","steps":["Hands on the wall, back leg straight, back heel pressed down.","Lean forward from the ankle until the calf pulls.","Then bend the back knee slightly to catch the lower calf. Thirty seconds each side."]},"hipflexor":{"name":"Hip flexor stretch","steps":["Half kneeling on the mat, back knee down, front foot planted.","Tuck the pelvis under and squeeze the back glute before you lean.","Push the hips gently forward. Thirty seconds each side."]},"legswing":{"name":"Leg swings","steps":["Hold the rack for balance, stand tall.","Swing one leg front to back, relaxed, letting the range build.","Then side to side. Ten each direction, each leg."]},"armcircle":{"name":"Arm circles","steps":["Stand tall, arms out to the sides.","Small circles first, building to full range overhead and back.","Reverse direction halfway through."]},"wgs":{"name":"World's greatest stretch","steps":["Step into a deep lunge and put both hands on the floor inside the front foot.","Drop the back hip toward the floor, then reach the inside hand up and rotate the chest open.","Follow your hand with your eyes. Both sides, slowly."]}};

/* ---------- progression ---------- */
const setsFor=(e,wi,d)=>{const W=WEEKS[wi];
 if(d&&d.key==="sun")return e.sets;
 if(e.role==="main")return W.mainSets;
 const b=(e.role==="acc"&&(!d||d.work.length<=4))?W.addSet:0;
 return Math.max(2,e.sets+b);};
const repsFor=(e,wi)=>{const W=WEEKS[wi];
 if(e.role==="hold")return e.reps;
 if(e.role==="main")return Math.max(3,e.reps+W.repShift);
 return Math.max(6,e.reps+W.repShift);};
const restFor=(e,wi)=>Math.round(e.rest*WEEKS[wi].restMul);
function estMin(d,wi){let t=20+d.ign.rounds*(d.ign.work+d.ign.rest);
 d.work.forEach(e=>{const n=setsFor(e,wi,d);let w=e.role==="hold"?e.reps:Math.max(24,repsFor(e,wi)*3.2);
  if(e.side)w*=2;t+=25+n*w+(n-1)*restFor(e,wi);});
 t+=20+d.eng.rounds*(d.eng.work+d.eng.rest);
 d.core.forEach(e=>{let w=e.role==="hold"?e.reps:Math.max(20,e.reps*2.6);if(e.side)w*=2;
  t+=15+e.sets*w+(e.sets-1)*e.rest;});
 t+=12+d.stretch.reduce((a,x)=>a+x[1],0);return Math.round(t/60);}
const musOf=d=>{const o=[];d.work.concat(d.core).forEach(e=>e.mus.forEach(m=>{if(!o.includes(m))o.push(m)}));return o};
const BARBELL={squat_bar:20,bench_bar:20,rdl_bar:20};
function plates(kg,pat){const bar=BARBELL[pat];if(!bar||kg<=bar)return"";
 let side=(kg-bar)/2,out=[];[25,20,15,10,5,2.5,1.25].forEach(p=>{while(side>=p-.01){out.push(p);side-=p}});
 return side>.05?"":`${bar} bar + ${out.join(" + ")} each side`;}

  AU.gain=AU.ctx.createGain();AU.gain.gain.value=AU.vol;AU.gain.connect(AU.ctx.destination);}
 if(AU.ctx.state!=="running")AU.ctx.resume();
 const b=AU.ctx.createBufferSource();b.buffer=AU.ctx.createBuffer(1,1,22050);b.connect(AU.gain);b.start(0);
 AU.ready=AU.ctx.state==="running";}catch(e){AU.ready=false}return AU.ready;}

 ()=>{if(AU.ctx&&AU.ctx.state!=="running")AU.ctx.resume()},{passive:true}));
function tone(f,dur,when,p){if(!AU.ctx||!AU.on)return;const t=AU.ctx.currentTime+(when||0);
 [["square",f,.6],["sine",f*2,.32]].forEach(([ty,fr,mix])=>{const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=ty;o.frequency.setValueAtTime(fr,t);const pk=Math.max(.0002,(p||1)*mix);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.gain);o.start(t);o.stop(t+dur+.04);});}

/* Pick the most natural installed voice rather than the robotic default,
   then slow it slightly and let punctuation do the phrasing. */
const VOICE={v:null};
function pickVoice(){
 if(!("speechSynthesis"in window))return;
 const vs=speechSynthesis.getVoices()||[];if(!vs.length)return;
 const en=vs.filter(v=>/^en/i.test(v.lang));
 const pool=en.length?en:vs;
 const pref=[/premium/i,/enhanced/i,/neural/i,/natural/i,/siri/i,
             /samantha/i,/karen/i,/serena/i,/moira/i,/tessa/i,/daniel/i,
             /google (uk|us) english/i];
 for(const p of pref){const m=pool.find(v=>p.test(v.name));if(m){VOICE.v=m;return}}
 VOICE.v=pool.find(v=>/^en-AU/i.test(v.lang))||pool.find(v=>/^en-GB/i.test(v.lang))||pool[0];
}
if("speechSynthesis"in window){pickVoice();
 try{speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}}

/* Inside a viewer frame the host intercepts external links and only a new
   context works, so we use _blank there. Run the file on its own — saved to
   your home screen — and we navigate the same tab instead: the YouTube app
   takes over as a universal link and there is no leftover tab at all. */
function goVideo(name){
 const url=yt(name);
 try{
  const a=document.createElement("a");
  a.href=url; a.target=FRAMED?"_blank":"_self";
  if(FRAMED)a.rel="noopener";

}

  <div class="meta">${estMin(d,S.week)} min · ${d.work.length} lifts · ${d.core.length} core · ${d.eng.n}</div></button>`).join("")}
 <footer><b>Swaps.</b> Every exercise carries one or two alternates that train the same thing on different equipment. Same sets, reps and rest, so your log stays comparable. Hit <b>Swap</b> mid-session and pick one.<br><br>
 <b>Pause anytime.</b> Freezes every clock. From there you can jump straight to a YouTube demo and come back where you left off.<br><br>
 <b>The log is the programme.</b> Enter weight and reps for each set; next week the screen shows what to beat. That is what makes eight weeks work.</footer>`;
 if(rs){const rb=el.querySelector("#rsm");if(rb)rb.onclick=()=>resume(rs)}
 el.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{S.week=+b.dataset.w;home();window.scrollTo(0,0)});
 el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>prev(+b.dataset.d));
 el.querySelector("#t1").onclick=()=>{AU.on=!AU.on;home()};
 el.querySelector("#t2").onclick=()=>{AU.voice=!AU.voice;home()};
 el.querySelector("#vol").oninput=e=>{AU.vol=+e.target.value;if(AU.gain)AU.gain.gain.value=AU.vol};
 el.querySelector("#ts").onclick=()=>{const ok=aInit();if(AU.gain)AU.gain.gain.value=AU.vol;
  const s=document.getElementById("ss");s.innerHTML="Audio: <b>"+(ok?"ready":"blocked — check the silent switch")+"</b>";
  s.className="snd"+(ok?"":" warn");say("Rest ending in");cdown(6);
  let n=5;const iv=setInterval(()=>{if(n>=1)say(String(n));if(--n<0)clearInterval(iv)},1000);
  setTimeout(()=>{cGo();say("Go. Set two of four.")},6000);};
}

/* ---------- preview ---------- */
let pFigs=[];
function mount(root){pFigs.forEach(f=>f.stop());pFigs=[];
 root.querySelectorAll("[data-f]").forEach(sv=>{if(sv.dataset.f)pFigs.push(mkFig(sv,sv.dataset.f,{scale:.66,ox:110,oy:188}))})}
function row(name,cue,pre,right,swaps){return `<button class="ex" data-x="${encodeURIComponent(name)}" data-c="${encodeURIComponent(cue||"")}">
 <span class="th"><svg viewBox="0 0 220 220" data-f="${patFor(name)||""}" style="width:100%;height:100%"></svg></span>
 <span class="b"><strong>${name}</strong>${pre?`<span class="pre">${pre}</span>`:""}<span class="cue">${cue||""}</span>
 ${swaps&&swaps.length?`<span class="sw2">Swap: ${swaps.map(s=>s.n).join(" / ")}</span>`:""}</span>
 ${right?`<span class="r">${right}</span>`:""}</button>`}
function prev(i){const d=DAYS[i],wi=S.week,el=document.getElementById("app");
 const ig=d.ign;
 el.innerHTML=`<button class="back" id="bk2">← The week</button>
 <header class="mast" style="border:0;padding-bottom:4px;margin-bottom:0">
  <div class="eyebrow">Week ${wi+1} · ${d.day} · about ${estMin(d,wi)} min</div><h1>${d.title}</h1><p>${d.blurb}</p></header>
 <div class="sec"><div class="sech"><span class="dot" style="background:var(--p25)"></span><h4>1 · Ignite</h4>
  <span class="fmt">${Math.round(ig.rounds*(ig.work+ig.rest)/60)} min</span></div>
  <p class="secsub">${ig.rounds} rounds · ${ig.work}s on, ${ig.rest}s off · rotating through the list</p>
  ${ig.moves.map(m=>row(m,(ig.cues&&ig.cues[m])||"",null,`${ig.work}s`)).join("")}</div>
 <div class="sec"><div class="sech"><span class="dot" style="background:var(${d.color})"></span><h4>2 · Strength</h4>
  <span class="fmt">${d.work.length} exercises</span></div>
  <p class="secsub">All sets of one exercise before the next. Swap if a station is taken.</p>
  ${d.work.map(e=>{const n=setsFor(e,wi,d),r=repsFor(e,wi),l=STORE.best(d.key,e.n,wi);
   const pre=e.role==="hold"?`${n} × ${r}s${e.side?" each side":""} · rest ${restFor(e,wi)}s`
    :`${n} × ${r}${e.side?" each side":""} @ RPE ${WEEKS[wi].rpe} · rest ${restFor(e,wi)}s`;
   return row(e.n,e.cue,pre,l?`last<br>${l.top}kg`:"",e.swaps)}).join("")}</div>
 <div class="sec"><div class="sech"><span class="dot" style="background:var(--p10)"></span><h4>3 · Engine</h4>
  <span class="fmt">${Math.round(d.eng.rounds*(d.eng.work+d.eng.rest)/60)} min</span></div>
  ${row(d.eng.n,d.eng.cue,`${d.eng.rounds} rounds · ${d.eng.work}s on, ${d.eng.rest}s off`,"",d.eng.swaps)}</div>
 <div class="sec"><div class="sech"><span class="dot" style="background:var(--p20)"></span><h4>4 · Core</h4>
  <span class="fmt">mat room</span></div>
  <p class="secsub">Mat, big ball and slam ball only — nothing anyone queues for.</p>
  ${d.core.map(e=>row(e.n,e.cue,e.role==="hold"?`${e.sets} × ${e.reps}s${e.side?" each side":""}`:`${e.sets} × ${e.reps}`,"",e.swaps)).join("")}</div>
 <div class="sec"><div class="sech"><span class="dot" style="background:var(--p15)"></span><h4>5 · Stretch</h4>
  <span class="fmt">${Math.round(d.stretch.reduce((a,x)=>a+x[1],0)/60)} min</span></div>
  ${d.stretch.map(x=>row(x[0],x[2],null,mmss(x[1]))).join("")}</div>
 <button class="start" id="go">Start session</button>`;
 window.scrollTo(0,0);mount(el);
 el.querySelector("#bk2").onclick=()=>{pFigs.forEach(f=>f.stop());home();window.scrollTo(0,0)};
 el.querySelector("#go").onclick=()=>begin(i);
 el.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
  const nm=decodeURIComponent(b.dataset.x);
  const all=d.work.concat(d.core).find(e=>e.n===nm);
  const sw=all?all.swaps:(nm===d.eng.n?d.eng.swaps:[]);
  showEx(nm,decodeURIComponent(b.dataset.c),sw,null)});
}

/* ---------- run ---------- */
async function awake(){try{if("wakeLock"in navigator)S.wake=await navigator.wakeLock.request("screen")}catch(e){}}
const unawake=()=>{try{S.wake&&S.wake.release();S.wake=null}catch(e){}};
function begin(i){aInit();if(AU.gain)AU.gain.gain.value=AU.vol;
 pFigs.forEach(f=>f.stop());pFigs=[];
 S.d=DAYS[i];S.bi=0;S.tIdx=0;S.qi=0;S.set=1;S.rest=false;S.ip="work";S.round=1;
 S.q=S.d.work.map((_,k)=>k);S.log=[];S.swapped={};S.t0=Date.now();S.paused=0;S.reps=0;
 S.left=S.d.ign.work;
 document.getElementById("run").classList.add("on");awake();
 startCountdown(()=>{paint();cGo();say(pick(LEAD_GO,0)+". "+curName()+".")});
 runClock();}

function resume(r){aInit();if(AU.gain)AU.gain.gain.value=AU.vol;
 pFigs.forEach(f=>f.stop());pFigs=[];
 S.d=DAYS[r.day];S.week=r.week;S.bi=r.bi;S.qi=r.qi;S.q=r.q;S.set=r.set;S.rest=r.rest;S.left=r.left;
 S.tIdx=r.tIdx;S.round=r.round;S.ip=r.ip;S.swapped=r.swapped||{};S.log=r.log||[];S.t0=r.t0;S.paused=r.paused||0;
 S.weight=r.weight||20;S.reps=r.reps||0;S.spoke=null;
 Object.keys(S.swapped).forEach(k=>{const e=S.d.work.concat(S.d.core).find(x=>x.n===k);
  if(e){const s=e.swaps.find(y=>y.n===S.swapped[k]);if(s)EX_PAT[s.n]=s.pat}});
 document.getElementById("run").classList.add("on");awake();paint();runClock();pauseSession();}

function runClock(){clearInterval(S.tick);let last=Date.now();
 S.tick=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;
  if(S.pausedAt)return;
  const b=blk(),timed=(b!=="work"&&b!=="core")||S.rest;
  if(!timed)return;
  S.left-=dt;const sec=Math.ceil(S.left);
  if(sec<=5&&sec>=1&&sec!==S.spoke){S.spoke=sec;
   if(AU.voice&&(S.rest||b==="ign"||b==="eng"))say(String(sec));
   const st=document.getElementById("stage");st.classList.add("pulse");setTimeout(()=>st.classList.remove("pulse"),470);}
  if(S.left<=0){done();return}
  clock();},100);}

function startCountdown(then){const o=document.getElementById("cd"),n=document.getElementById("cdn");
 let k=3;o.classList.add("on");n.textContent=k;say("Three,");tone(880,.18,0,1);
 const iv=setInterval(()=>{k--;
  if(k>0){n.textContent=k;say(k===2?"Two,":"One,");tone(880,.18,0,1)}
  else{clearInterval(iv);o.classList.remove("on");then&&then()}},1000);}

function done(){const b=blk(),d=S.d;
 if(b==="ign"){S.tIdx++;
  if(S.tIdx>=d.ign.rounds){nextBlock();return}
  if(S.ip==="work"){S.ip="rest";S.left=d.ign.rest;S.spoke=null;cRest();say("Rest.");}
  else{S.ip="work";S.left=d.ign.work;S.spoke=null;cGo();say(curName());}
  paint();return}
 if(b==="work"){S.rest=false;S.spoke=null;cGo();
  say(pick(LEAD_GO,S.set)+", set "+wnum(S.set)+" of "+wnum(setsFor(curE(),S.week,d))+".");paint();return}
 if(b==="eng"){
  if(S.ip==="work"){if(S.round>=d.eng.rounds){nextBlock();return}
   S.ip="rest";S.left=d.eng.rest;S.spoke=null;cRest();say("Rest.");cdown(S.left);paint();return}
  S.round++;S.ip="work";S.left=d.eng.work;S.spoke=null;cGo();say("Round "+wnum(S.round)+" of "+wnum(d.eng.rounds)+".");cdown(S.left);paint();return}
 if(b==="core"){S.rest=false;S.spoke=null;cGo();say(pick(LEAD_GO,S.qi)+", "+curName()+".");paint();return}
 if(b==="stretch"){S.tIdx++;
  if(S.tIdx>=d.stretch.length){finish();return}
  S.left=d.stretch[S.tIdx][1];S.spoke=null;cTick();say(curName());paint();return}}

function nextBlock(){S.bi++;S.spoke=null;S.tIdx=0;S.qi=0;S.set=1;S.rest=false;S.ip="work";S.round=1;
 const b=blk(),d=S.d;
 if(b==="work"){cGo();say("Strength time. "+curName()+", "+wnum(setsFor(curE(),S.week,d))+" sets of "+wnum(repsFor(curE(),S.week))+".");paint();return}
 if(b==="eng"){S.left=d.eng.work;cGo();say("Engine block. "+d.eng.n+".");paint();cdown(S.left);return}
 if(b==="core"){cGo();say("Core time. "+curName()+".");paint();return}
 if(b==="stretch"){S.left=d.stretch[0][1];cTick();say("Last block, stretching. "+curName()+".");paint();return}
 finish();}

function setDone(){const b=blk(),e=curE(),d=S.d;
 const nm=S.swapped[e.n]||e.n;
 const n=b==="work"?setsFor(e,S.week,d):e.sets;
 if(b==="work"){S.log.push({ex:nm,set:S.set,weight:S.weight,reps:S.reps});
  const rec=STORE.get(S.week,d.key,e.n)||{sets:[],top:0};
  rec.sets=rec.sets.filter(x=>x.set!==S.set);
  rec.sets.push({set:S.set,weight:S.weight,reps:S.reps,as:nm});
  rec.sets.sort((a,b)=>a.set-b.set);rec.top=Math.max(...rec.sets.map(x=>x.weight),0);
  STORE.put(S.week,d.key,e.n,rec);}
 const rst=b==="work"?restFor(e,S.week):e.rest;
 if(S.set>=n){advanceEx();return}
 S.set++;S.rest=true;S.left=rst;S.spoke=null;
 cRest();say(pick(LEAD_REST,S.set)+". Rest "+wnum(rst)+" seconds, then set "+wnum(S.set)+".");cdown(S.left);paint();}

function advanceEx(){const b=blk();
 if(b==="work"){S.q.splice(S.qi,1);if(S.qi>=S.q.length)S.qi=0;
  if(!S.q.length){nextBlock();return}
  S.set=1;S.rest=false;S.spoke=null;const e=curE();
  cGo();say("Next up, "+curName()+". "+wnum(setsFor(e,S.week,S.d))+" sets of "+wnum(repsFor(e,S.week))+".");paint();return}
 S.qi++;if(S.qi>=S.d.core.length){nextBlock();return}
 S.set=1;S.rest=false;S.spoke=null;cGo();say("Next up, "+curName()+".");paint();}

function defer(){if(blk()!=="work"||S.q.length<=1){say("Nothing else to move to");return}
 const id=S.q.splice(S.qi,1)[0];S.q.push(id);if(S.qi>=S.q.length)S.qi=0;
 S.set=1;S.rest=false;S.spoke=null;cTick();say("No problem, moved to the end. Next up, "+curName()+".");paint();}

/* ---------- paint ---------- */
function clock(){const c=document.getElementById("rc"),b=blk();
 const timed=(b!=="work"&&b!=="core")||S.rest;
 c.textContent=timed?mmss(Math.max(0,Math.ceil(S.left))):"";
 c.style.color=S.rest||S.ip==="rest"?"var(--p20)":b==="stretch"?"var(--p15)":"var(--p10)";}
function paintBlocks(){document.getElementById("rb").innerHTML=BL.map(([k,l],i)=>
 `<div class="bl ${i<S.bi?"on":i===S.bi?"cur":""}"><i></i><span>${l}</span></div>`).join("")}
function setFig(){const k=curPat(),sv=document.getElementById("demo");
 if(S.fig)S.fig.stop();
 if(k)S.fig=mkFig(sv,k,{scale:.58,ox:110,oy:130});else{sv.innerHTML="";S.fig={stop(){}}}}
function paint(){const g=id=>document.getElementById(id),b=blk(),d=S.d;
 saveRun();
 paintBlocks();g("rlog").style.display="none";g("rd").innerHTML="";g("rl").textContent="";g("rt").innerHTML="";
 const main=g("bm");main.className="prim";
 g("bs").style.opacity=(b==="work"||b==="core"||b==="eng")?1:.35;
 if(b==="ign"){g("rh").textContent=`Ignite · round ${Math.min(S.tIdx+1,d.ign.rounds)} of ${d.ign.rounds}`;
  g("rs").textContent=S.ip==="work"?"Work":"Rest";g("rs").style.color=S.ip==="work"?"var(--p25)":"var(--muted)";
  g("rn").textContent=curName();g("rq").textContent=(d.ign.cues&&d.ign.cues[curName()])||"Hard bodyweight cardio — be sweating by the end.";
  main.textContent="Skip ahead";main.className="prim dim";}
 else if(b==="eng"){g("rh").textContent=`Engine · round ${Math.min(S.round,d.eng.rounds)} of ${d.eng.rounds}`;
  g("rs").textContent=S.ip==="work"?"Work":"Rest";g("rs").style.color=S.ip==="work"?"var(--p10)":"var(--muted)";
  g("rn").textContent=curName();g("rq").textContent=d.eng.cue;
  main.textContent="Skip ahead";main.className="prim dim";}
 else if(b==="stretch"){g("rh").textContent=`Stretch · ${S.tIdx+1} of ${d.stretch.length}`;
  g("rs").textContent="Stretch";g("rs").style.color="var(--p15)";
  g("rn").textContent=curName();g("rq").textContent=d.stretch[S.tIdx][2];
  main.textContent="Skip ahead";main.className="prim dim";}
 else{const e=curE(),n=b==="work"?setsFor(e,S.week,d):e.sets,r=b==="work"?repsFor(e,S.week):e.reps;
  const nm=S.swapped[e.n]||e.n;
  g("rh").textContent=b==="work"
   ?`Strength · exercise ${d.work.length-S.q.length+1} of ${d.work.length}`
   :`Core · ${S.qi+1} of ${d.core.length}`;
  g("rs").textContent=S.rest?"Rest":"Work";g("rs").style.color=S.rest?"var(--p20)":`var(${d.color})`;
  g("rn").textContent=nm;
  g("rt").innerHTML=e.role==="hold"?`Set ${S.set} of ${n} · <b>${r}s${e.side?" each side":""}</b>`
   :`Set ${S.set} of ${n} · <b>${r} reps${e.side?" each side":""}</b>`+(b==="work"?` @ RPE ${WEEKS[S.week].rpe}`:"");
  let dt="";for(let k=1;k<=n;k++)dt+=`<div class="sd ${k<S.set?"on":k===S.set?"cur":""}"></div>`;
  g("rd").innerHTML=dt;
  if(b==="work"){const l=STORE.best(d.key,e.n,S.week);
   const pl=plates(S.weight,patFor(nm));
   g("rl").textContent=S.rest?(pl||"")
    :(l?`Week ${l.week+1}: ${l.top} kg — beat it`+(pl?" · "+pl:""):(pl||(STORE.ok()?"No history yet — this is your baseline":"")));
   if(!S.rest&&e.role!=="hold"){g("rlog").style.display="flex";
    if(!S.reps)S.reps=r;if(l&&S.set===1&&S.weight===20)S.weight=l.top||20;
    g("wv").textContent=S.weight;g("rv").textContent=S.reps;}}
  g("rq").textContent=S.rest?`Next: set ${S.set} of ${n}`:e.cue;
  main.textContent=S.rest?"Skip rest":(e.role==="hold"&&!S.rest?"Hold done":"Set done");
  main.className=S.rest?"prim rest":"prim";}
 setFig();clock();}

/* ---------- finish ---------- */
function finish(){clearInterval(S.tick);unawake();clearRun();cEnd();say("Session complete. Well done, that is another one banked.");
 if(S.fig)S.fig.stop();
 const d=S.d,el=document.getElementById("app");
 document.getElementById("run").classList.remove("on");
 const by={};S.log.forEach(l=>{(by[l.ex]=by[l.ex]||[]).push(l)});
 const mins=Math.round((Date.now()-S.t0-S.paused)/60000);
 el.innerHTML=`<div class="end"><div class="eyebrow">Week ${S.week+1} · ${d.day} · ${mins} min</div>
  <h2>${d.title} done.</h2>
  <p>${STORE.ok()?"Saved. Next week this screen shows you what to beat.":"Storage is unavailable here — copy the log before you close it."}</p>
  <div class="lt">${Object.keys(by).length?Object.keys(by).map(k=>
   `<div class="lr"><b>${k}</b><span>${by[k].map(x=>x.weight+"×"+x.reps).join("  ·  ")}</span></div>`).join("")
   :`<div class="lr"><b>No sets logged</b><span>—</span></div>`}</div>
  <button class="start" id="cp">Copy the log</button><button class="btnwide" id="hm">Back to the week</button></div>`;
 el.querySelector("#hm").onclick=()=>{home();window.scrollTo(0,0)};
 el.querySelector("#cp").onclick=()=>{const t=`${d.title} — week ${S.week+1}\n`+Object.keys(by).map(k=>
   `${k}: `+by[k].map(x=>x.weight+"kg x "+x.reps).join(", ")).join("\n");
  try{navigator.clipboard.writeText(t);el.querySelector("#cp").textContent="Copied"}
  catch(e){el.querySelector("#cp").textContent="Copy failed — screenshot it"}};}

/* ---------- controls ---------- */
document.getElementById("bm").onclick=()=>{aInit();const b=blk();
 if(b==="ign"||b==="eng"||b==="stretch"){S.left=-1;done();return}
 if(S.rest){S.rest=false;S.spoke=null;cGo();say("Go. Set "+S.set);paint();return}
 setDone();};
document.getElementById("bk").onclick=()=>{const b=blk();
 if(b==="work"||b==="core")advanceEx();else if(b==="stretch"){S.tIdx=S.d.stretch.length-1;S.left=-1;done()}
 else nextBlock();};
document.getElementById("bs").onclick=()=>{const b=blk(),d=S.d;
 if(b==="eng"){showEx(curName(),d.eng.cue,d.eng.swaps,s=>{S.swapped["__eng"]=s.n;
  EX_PAT[s.n]=s.pat;say("Switched to "+s.n+".");paint()});return}
 const e=curE();if(!e)return;
 showEx(S.swapped[e.n]||e.n,e.cue,e.swaps,s=>{S.swapped[e.n]=s.n;EX_PAT[s.n]=s.pat;
  say("Switched to "+s.n+".");paint()});};
document.getElementById("bv").onclick=openVideo;
function pauseSession(){S.pausedAt=Date.now();
 document.getElementById("pzt").textContent=mmss(Math.round((Date.now()-S.t0-S.paused)/1000))+" elapsed";
 document.getElementById("pzn").textContent=curName();
 document.getElementById("pz").classList.add("on");saveRun();
 try{speechSynthesis.cancel()}catch(e){}}
document.getElementById("bp").onclick=pauseSession;
document.getElementById("pzr").onclick=()=>{S.paused+=Date.now()-S.pausedAt;S.pausedAt=0;
 document.getElementById("pz").classList.remove("on");aInit();
 const b=blk(),timed=(b!=="work"&&b!=="core")||S.rest;
 if(timed){S.spoke=null;cdown(S.left)}};
document.getElementById("pzv").onclick=openVideo;
document.getElementById("pze").onclick=()=>{document.getElementById("pz").classList.remove("on");
 S.pausedAt=0;clearRun();finish()};
document.getElementById("bq").onclick=()=>{clearInterval(S.tick);unawake();if(S.fig)S.fig.stop();
 try{speechSynthesis.cancel()}catch(e){}
 document.getElementById("run").classList.remove("on");home();window.scrollTo(0,0)};
const stp=(k,v)=>{if(k==="w"){S.weight=Math.max(0,Math.round((S.weight+v)*4)/4);
  document.getElementById("wv").textContent=S.weight;
  const e=curE();if(e){const pl=plates(S.weight,patFor(S.swapped[e.n]||e.n));if(pl)document.getElementById("rl").textContent=pl}}
 else{S.reps=Math.max(0,S.reps+v);document.getElementById("rv").textContent=S.reps}};
document.getElementById("wu").onclick=()=>stp("w",2.5);
document.getElementById("wd").onclick=()=>stp("w",-2.5);
document.getElementById("ru").onclick=()=>stp("r",1);
document.getElementById("rdn").onclick=()=>stp("r",-1);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.d){awake();aInit()}});
home();
</script>
</body>
</html>
